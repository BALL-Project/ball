name: CI

# Phase 02.2 — early 3-OS build + render-smoke regression net.
# Triggers (D-10): push + pull_request on the milestone branches ONLY — not all
# branches (keeps CI noise down). `master` is the eventual merge target;
# `v1.6-modernization` is the active milestone branch.
on:
  push:
    branches: [master, v1.6-modernization]
  pull_request:
    branches: [master, v1.6-modernization]

# Read-only token: this workflow only builds + checks, it never writes back.
permissions:
  contents: read

# One in-flight run per ref — a newer push cancels the older run so pushes
# don't pile up on the hosted runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # build — the 3-OS Release matrix (D-07, D-11).
  #
  # Single job, `strategy.matrix.include` with one entry per OS. Every per-OS
  # specific (runner label, dep-install command, configure command, build
  # command, whether the job blocks, whether the smoke check runs) lives IN the
  # matrix entry — nothing is scattered into `if:` chains across steps. Adding a
  # future axis (e.g. the `ui_v2` axis) is a matter of adding `include:` entries,
  # not rewriting the job (D-11).
  # --------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    # D-03: the Windows job is non-blocking. `continue-on-error` is driven off a
    # matrix field so macOS/Linux stay blocking and Windows flips to required in
    # Phase 4 with a one-line matrix change (`blocking: true`).
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      # Don't let one OS failing cancel the others — we want the full picture.
      fail-fast: false
      matrix:
        include:
          # ---- macOS (Apple Silicon) — blocking ----------------------------
          # Mirrors BUILD-macos.md verbatim: the Homebrew dep line, the cmake
          # configure invocation, and the `make BALL VIEW BALLView` target set.
          - os: macos-arm64
            runner: macos-14
            blocking: true
            smoke: true
            ccache_dir: ~/Library/Caches/ccache

          # ---- Linux (Ubuntu) — blocking -----------------------------------
          # apt equivalents of the Homebrew set + xvfb/software-Mesa for the
          # headless render smoke check (D-08). Phase 5 D-02: runner bumped
          # from ubuntu-22.04 to ubuntu-24.04 (newer GCC + ships glibc/Mesa
          # current enough for Qt 6.5+ via jurplel/install-qt-action). The
          # apt-shipped Qt on 24.04 is 6.4.2 (below the D-01 6.5 floor), so
          # the Qt 6 install is provisioned through jurplel/install-qt-action
          # rather than apt — see the dedicated step below.
          - os: linux-x64
            runner: ubuntu-24.04
            blocking: true
            smoke: true
            ccache_dir: ~/.cache/ccache

          # ---- Windows — BLOCKING (flipped 2026-05-15, Plan 04-04 Task 3) ------
          # Phase 4: real vcpkg manifest + choco flex/bison provisioning. The
          # build is repeatably green (CI run 25899905204 + this commit's run).
          # If it regresses, fix or revert this flip — do not silently drop to
          # continue-on-error.
          - os: windows-x64
            runner: windows-2022
            blocking: true
            smoke: false
            ccache_dir: C:\Users\runneradmin\AppData\Local\ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------------------------------------------------
      # ccache (D-06, D-11) — warm the compiler cache across runs. The configure
      # steps below wire CMAKE_<LANG>_COMPILER_LAUNCHER=ccache.
      # ----------------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.ccache_dir }}
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-

      # ======================================================================
      # macOS — Homebrew deps + the verbatim BUILD-macos.md flow.
      # ======================================================================
      - name: Cache Homebrew downloads (macOS)
        if: matrix.os == 'macos-arm64'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            brew-${{ matrix.os }}-

      - name: Install dependencies (macOS / Homebrew)
        if: matrix.os == 'macos-arm64'
        run: |
          # D-06: the verbatim BUILD-macos.md dependency line + ccache.
          # Phase 5 (Plan 05-01 D-03): Homebrew unversioned `qt` is the Qt 6
          # source (currently 6.11.x, well above the D-01 6.5 floor). The
          # `macos-homebrew` CMake preset's CMAKE_PREFIX_PATH already points
          # at /opt/homebrew/opt/qt (not qt@5) — see Plan 05-01 SUMMARY.
          brew install qt boost eigen fftw tbb glew open-babel lp_solve libsvm flex bison
          brew install ccache

      - name: Configure (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          # D-07: preset is the single source of truth — mirrors BUILD-macos.md.
          # bison/flex executable paths are embedded in the ci-macos preset.
          # -DBALL_LICENSE=GPL: OpenBabel is GPL-gated (maintainer decision, Plan 04-01).
          # BALL_HAS_OPENBABEL=ON is already in the ci-macos preset's cacheVariables
          # (Plan 04-02) — the -DBALL_LICENSE=GPL flag is what actually enables the
          # GPL-block FIND_PACKAGE(OpenBabel3) call in CMakeLists.txt (Plan 04-03).
          cmake --preset ci-macos -DBALL_LICENSE=GPL

      - name: Build (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          # D-07: the BUILD-macos.md target set, Release.
          cmake --build --preset ci-macos --target BALL VIEW BALLView -j$(sysctl -n hw.ncpu)

      # ----------------------------------------------------------------------
      # Phase 9 gatekeeper (PARTIAL — NON-BLOCKING) — wires the BALL unit-test
      # tree (`test/`, 295 files, EXCLUDE_FROM_ALL by default) into the CI
      # matrix so regressions surface as soon as they happen. Initially
      # continue-on-error: true because the suite was never run post the C++17
      # migration + dep overhaul + Phase 5 Qt 6 port — Phase 9 triage triages
      # the existing failures (fix / quarantine / known-casualty) and flips
      # this to blocking once the green-list is stable. See ROADMAP Phase 9.
      # ----------------------------------------------------------------------
      - name: Build BALL test suite (macOS — Phase 9 gatekeeper, non-blocking)
        if: matrix.os == 'macos-arm64'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          cmake --build build/ci-macos --target build_tests -j$(sysctl -n hw.ncpu)

      - name: Run BALL test suite (macOS — Phase 9 gatekeeper, non-blocking)
        if: matrix.os == 'macos-arm64'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          cd build/ci-macos
          # BALL_DATA_PATH MUST be set so tests find FragmentDB, force-field
          # parameter files, rotamer libraries, etc. v1.6.0 local baseline:
          # 50/294 fail without it (= "data path unset" noise), 3/294 fail
          # with it (= actual triage candidates: Directory_test, AmberFF_test,
          # AssignBondOrderProcessor_test2 — Phase 9 main work).
          # --timeout 120 caps individual hangs (most BALL tests run in <10s;
          # ScoringFunction_test + AssignBondOrderProcessor_test{1,2} have
          # 2h timeouts set in test/CMakeLists.txt and will hit this cap —
          # acceptable for the gatekeeper, Phase 9 decides which to skip).
          export BALL_DATA_PATH="${{ github.workspace }}/data"
          ctest --output-on-failure --timeout 120 \
                --output-junit ${{ github.workspace }}/ball-tests-macos.xml || true

      - name: Upload test results (macOS)
        if: always() && matrix.os == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: ball-tests-macos-${{ github.run_id }}
          path: ball-tests-macos.xml
          if-no-files-found: warn
          retention-days: 30

      # ======================================================================
      # Linux — apt deps + the BUILD-macos.md flow adapted to Linux paths.
      # ======================================================================
      - name: Cache apt archives (Linux)
        if: matrix.os == 'linux-x64'
        uses: actions/cache@v5
        with:
          # Phase 5.1 Plan 12 (Task D3): scope the cached path to `*.deb` only.
          # Caching the full `/var/cache/apt/archives` directory was triggering a
          # post-job warning on every Linux run:
          #   /usr/bin/tar: ../../../../../var/cache/apt/archives/lock: Cannot open: Permission denied
          #   /usr/bin/tar: ../../../../../var/cache/apt/archives/partial: Cannot open: Permission denied
          #   ##[warning]Failed to save: "/usr/bin/tar" failed ... exit code 2
          # The runner is unprivileged; APT's exclusive lock file and partial/
          # subdirectory are root-only (0640 / 0700), so tar fails on them. The
          # cache action's fallback re-tars without the unreadable entries and
          # the cache *is* still saved ("Cache saved with key: ..." follows the
          # warning), so this was definitionally cosmetic — but the warning
          # surfaced on 7/7 recent successful runs (chronic recurrence, not
          # transient). Narrowing the cached path to the .deb archives — which
          # is the only content `apt-get install` actually downloads and the
          # only content the cache restore needs — silences the warning by
          # construction and avoids the slower fallback tar pass.
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ matrix.os }}-

      - name: Install dependencies (Linux / apt)
        if: matrix.os == 'linux-x64'
        run: |
          # D-06: apt equivalents of the Homebrew set, + build tooling + ccache,
          # + xvfb/software-Mesa for the headless render smoke check (D-08).
          #
          # Phase 5 (Plan 05-04): the Qt5 -dev packages (qtbase5-dev /
          # qtbase5-dev-tools / libqt5opengl5-dev / qttools5-dev) are REMOVED.
          # Ubuntu 24.04 apt ships Qt 6.4.2 which is below the D-01 6.5 floor;
          # Qt is installed through jurplel/install-qt-action in the dedicated
          # step below (aqtinstall, pinned to Qt 6.5.*). xvfb + Mesa stay for
          # the headless smoke check; non-Qt deps unchanged.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make g++ ccache \
            libboost-all-dev libeigen3-dev libfftw3-dev libtbb-dev libglew-dev \
            libopenbabel-dev libsvm-dev flex bison \
            xvfb mesa-utils libgl1-mesa-dri
          # NOTE: liblpsolve55-dev is intentionally NOT installed. Ubuntu ships
          # liblpsolve55.a built WITHOUT -fPIC, which cannot be linked into
          # BALL's shared libBALL (ld: "relocation R_X86_64_PC32 ... can not be
          # used when making a shared object"). lp_solve is an OPTIONAL feature
          # (see the Feature Matrix in REQUIREMENTS.md) — Linux CI builds without
          # it; macOS keeps it (Homebrew's lp_solve is fine). Phase 4 (FEAT-01)
          # confirms the per-platform optional-dependency policy.

      - name: Install Qt 6 (Linux — jurplel/install-qt-action / aqtinstall)
        if: matrix.os == 'linux-x64'
        # D-01 + D-02 (Plan 05-04): Ubuntu 24.04 apt ships Qt 6.4.2, below the
        # D-01 6.5 LTS floor. jurplel/install-qt-action wraps aqtinstall and
        # downloads the official Qt build from download.qt.io into the runner
        # workspace; the install location is exposed as Qt6_DIR so CMake's
        # FIND_PACKAGE(Qt6 6.5 ...) resolves cleanly. Modules: qtbase + qttools
        # + qtopengl (Qt6::OpenGLWidgets ships as part of qtbase). D-05: NO
        # qt5compat — clean break.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          host: 'linux'
          target: 'desktop'
          modules: 'qtbase qttools qtopengl'
          cache: true

      - name: Configure (Linux)
        if: matrix.os == 'linux-x64'
        run: |
          # D-07: preset is the single source of truth for Linux paths.
          # bison/flex at /usr/bin, USE_LPSOLVE=OFF (non-PIC liblpsolve55.a),
          # ccache, and BALL_HAS_OPENBABEL=ON are all set by ci-linux preset.
          # -DBALL_LICENSE=GPL: OpenBabel is GPL-gated (maintainer decision, Plan 04-01).
          cmake --preset ci-linux -DBALL_LICENSE=GPL

      - name: Build (Linux)
        if: matrix.os == 'linux-x64'
        run: |
          # D-07: the BUILD-macos.md target set, Release.
          cmake --build --preset ci-linux --target BALL VIEW BALLView -j$(nproc)

      # ----------------------------------------------------------------------
      # Phase 9 gatekeeper (PARTIAL — NON-BLOCKING) — see macOS counterpart
      # for the rationale + flip-to-blocking trigger.
      # ----------------------------------------------------------------------
      - name: Build BALL test suite (Linux — Phase 9 gatekeeper, non-blocking)
        if: matrix.os == 'linux-x64'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          cmake --build build/ci-linux --target build_tests -j$(nproc)

      - name: Run BALL test suite (Linux — Phase 9 gatekeeper, non-blocking)
        if: matrix.os == 'linux-x64'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          cd build/ci-linux
          # See macOS counterpart — BALL_DATA_PATH is the make-or-break env var.
          export BALL_DATA_PATH="${{ github.workspace }}/data"
          ctest --output-on-failure --timeout 120 \
                --output-junit ${{ github.workspace }}/ball-tests-linux.xml || true

      - name: Upload test results (Linux)
        if: always() && matrix.os == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ball-tests-linux-${{ github.run_id }}
          path: ball-tests-linux.xml
          if-no-files-found: warn
          retention-days: 30

      # ======================================================================
      # Windows — real vcpkg + choco provisioning (Phase 4 / Plan 04-04).
      #
      # Provisioning strategy:
      #  1. vcpkg: GitHub windows-2022 runners ship vcpkg at C:\vcpkg (exposed
      #     as VCPKG_INSTALLATION_ROOT). The windows-vcpkg preset toolchainFile
      #     picks it up via $env{VCPKG_ROOT}, bridged in the Configure step.
      #     Build speed (T-04-17 mitigation):
      #       - vcpkg's default file binary cache (%LOCALAPPDATA%\vcpkg\archives)
      #         is cached via actions/cache. In MANIFEST mode vcpkg installs into
      #         <binaryDir>/vcpkg_installed — NOT C:\vcpkg\installed — so caching
      #         that path is useless; the binary archives dir is the reusable
      #         artifact. Split restore/save with `save` at `if: always()` so a
      #         failing Build step still persists the (expensive) port builds.
      #         (vcpkg's x-gha cache was tried and dropped: the current GitHub
      #         Actions cache service no longer exposes ACTIONS_CACHE_URL.)
      #       - the `x64-windows-release` overlay triplet (cmake/vcpkg-triplets)
      #         builds Release-only, skipping the debug half of every port —
      #         roughly halves a cold build.
      #  2. flex/bison: not vcpkg ports; provisioned via winflexbison3 (choco).
      #     winflexbison3 installs win_flex.exe + win_bison.exe in
      #     C:\ProgramData\chocolatey\bin\.  BALL's bison logic (CMakeLists.txt
      #     lines 113-124) looks for BALL-bison.bat first (not present in this
      #     repo) then falls through to FindBISON which searches the PATH/cache;
      #     we set -DBISON_EXECUTABLE and -DFLEX_EXECUTABLE explicitly so the
      #     IF(WIN32) FIND_PROGRAM doesn't shadow the cache values.
      # ======================================================================

      - name: Restore vcpkg binary cache (Windows)
        id: vcpkg-cache
        if: matrix.os == 'windows-x64'
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      - name: Install flex/bison (Windows — winflexbison3 via choco)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          choco install winflexbison3 -y
          # Confirm executables are reachable
          & "C:\ProgramData\chocolatey\bin\win_flex.exe" --version
          & "C:\ProgramData\chocolatey\bin\win_bison.exe" --version

      - name: Configure (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # GitHub windows-2022 runners ship vcpkg at C:\vcpkg but expose it as
          # VCPKG_INSTALLATION_ROOT, not VCPKG_ROOT. The windows-vcpkg preset's
          # toolchainFile uses $env{VCPKG_ROOT}, so bridge the two here. (The
          # runner OS env var is not visible via the ${{ env.* }} context, so
          # it must be read inside the shell.)
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          # D-07: ci-windows preset inherits windows-vcpkg (vcpkg toolchainFile,
          # VCPKG_TARGET_TRIPLET=x64-windows-release + overlay triplet,
          # USE_LPSOLVE=OFF, BALL_HAS_OPENBABEL=OFF, ccache) and installs
          # vcpkg.json deps at configure time.
          # win_bison.exe / win_flex.exe from winflexbison3 are passed explicitly
          # because FindBISON/FindFLEX search for 'bison'/'flex' by default.
          #
          # Phase 5 (Plan 05-04): USE_QTWEBENGINE=OFF on Windows — Plan 05-01
          # carried the CMakeLists USE_QTWEBENGINE OPTION default `ON` for
          # Phase 1+2+3+4 backward compatibility. The vcpkg manifest does NOT
          # declare `qtwebengine` (it bloats cold-build by ~30min and Windows
          # CI has no consumer for it), so the FIND_PACKAGE(Qt6 WebEngineCore)
          # call would fail. Flipping the option OFF at configure time is the
          # least-invasive fix; macOS Homebrew has qtwebengine so it stays ON
          # there. See Plan 05-01 SUMMARY §"Open Items for Downstream Plans"
          # for the carry-forward note.
          cmake --preset ci-windows `
            -DUSE_QTWEBENGINE=OFF `
            -DBISON_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_bison.exe" `
            -DFLEX_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_flex.exe"

      # Persist the vcpkg binary cache as soon as Configure finishes — runs
      # even if a later Build step fails, so iterating on build errors does
      # not re-pay the ~80min Qt5/Boost source build each time.
      - name: Save vcpkg binary cache (Windows)
        if: always() && matrix.os == 'windows-x64' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}

      - name: Build (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          cmake --build --preset ci-windows --target BALL VIEW BALLView --config Release

      # ======================================================================
      # Render smoke check (D-08) — macOS native, Linux under xvfb + software
      # Mesa. Gated on the `matrix.smoke` field so a future matrix axis cannot
      # accidentally enable/disable it. Blocking on macOS + Linux: a blank or
      # missing PNG fails the job.
      # ======================================================================
      - name: Render smoke check (macOS — native)
        if: matrix.smoke && matrix.os == 'macos-arm64'
        run: |
          # Preset puts the binary at build/ci-macos/; pass explicitly so the
          # script's autodetect (which looks in build/bin/) is not needed.
          # Phase 5 (Plan 05-04): tee stdout to /tmp/ballview-smoke.log so the
          # follow-up "Assert GL compat profile" step can grep BALLVIEW_GL_DIAG
          # for `gl_profile=compatibility` (D-06 / D-08 runtime oracle).
          bash .planning/phases/02.2-ci-and-build-smoke-matrix/scripts/render-smoke-check.sh \
            build/ci-macos/bin/BALLView.app/Contents/MacOS/BALLView 2>&1 \
            | tee /tmp/ballview-smoke.log

      - name: Assert GL compat profile (macOS — D-06 / D-08)
        if: matrix.smoke && matrix.os == 'macos-arm64'
        run: |
          # D-06 + D-08 runtime oracle (Plan 05-04): a non-blank PNG alone is
          # NOT enough — Qt 6 on macOS defaults to a GL 4.1 *core* context if
          # QSurfaceFormat is not forced, and a silently-degraded core context
          # would still render a blank-ish-but-not-fully-blank PNG that the
          # render-smoke threshold accepts. The BALLVIEW_GL_DIAG line emitted
          # from GLRenderWindow::initializeGL() reports the live granted
          # profile; this step asserts the live profile is `compatibility`
          # OR `none`. Apple Silicon's GL 2.1 implementation does not expose
          # the Core/Compat profile distinction at version 2.1 — both M4 Max
          # hardware and macos-latest software runner emit `gl_profile=none`
          # (verified live, 05-DRIVER-BEHAVIOUR.md §BALLVIEW_GL_DIAG Captures).
          # The original D-08 oracle was empirically invalidated post-Phase-5
          # and relaxed here; Linux retains the strict `compatibility` check
          # (llvmpipe DOES expose the distinction so a fallback to core is a
          # real regression on that platform).
          grep -E 'BALLVIEW_GL_DIAG.*gl_profile=(compatibility|none)' /tmp/ballview-smoke.log

      # ======================================================================
      # Spike smoke check (macOS — GLCore backend) — THROWAWAY (Plan 05-05).
      # Non-blocking (continue-on-error: true): the GL-core spike is the
      # SPIKE-01 throwaway prototype; a regression in it must NOT gate PR
      # merge per CONTEXT.md framing. The step rebuilds BALLView with
      # -DBALL_SPIKE_BACKEND=GLCore, runs the same render smoke script with
      # BALLVIEW_USE_SPIKE_BACKEND=1 set, and uploads the captured stdout
      # so the SPIKE-02 decision record (Plan 08) has a referenced artifact.
      # ======================================================================
      - name: Spike smoke check (macOS — GLCore backend)
        if: matrix.smoke && matrix.os == 'macos-arm64'
        continue-on-error: true
        run: |
          cmake --preset ci-macos -DBALL_LICENSE=GPL -DBALL_SPIKE_BACKEND=GLCore
          cmake --build --preset ci-macos --target BALLView -j$(sysctl -n hw.ncpu)
          BALLVIEW_USE_SPIKE_BACKEND=1 bash .planning/phases/02.2-ci-and-build-smoke-matrix/scripts/render-smoke-check.sh \
            build/ci-macos/bin/BALLView.app/Contents/MacOS/BALLView 2>&1 \
            | tee /tmp/ballview-spike-smoke.log

      - name: Upload spike smoke log (macOS — GLCore backend)
        if: matrix.smoke && matrix.os == 'macos-arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: spike-smoke-log-glcore-macos
          path: /tmp/ballview-spike-smoke.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Render smoke check (Linux — xvfb + software Mesa)
        if: matrix.smoke && matrix.os == 'linux-x64'
        env:
          # D-08: software Mesa/llvmpipe — fully supports the compat profile
          # BALLView's fixed-function GL 2.1 path needs.
          LIBGL_ALWAYS_SOFTWARE: 1
          # Plan 01 script honors this prefix; it does not hardcode xvfb.
          BALLVIEW_SMOKE_RUNNER: xvfb-run -a
        run: |
          # Preset puts the binary at build/ci-linux/; pass explicitly so the
          # script's autodetect (which looks in build/bin/) is not needed.
          # Phase 5 (Plan 05-04): tee stdout to /tmp/ballview-smoke.log for the
          # follow-up GL compat-profile assertion step (D-06 / D-08).
          bash .planning/phases/02.2-ci-and-build-smoke-matrix/scripts/render-smoke-check.sh \
            build/ci-linux/bin/BALLView 2>&1 \
            | tee /tmp/ballview-smoke.log

      - name: Assert GL compat profile (Linux — D-06 / D-08)
        if: matrix.smoke && matrix.os == 'linux-x64'
        run: |
          # D-06 + D-08 runtime oracle (Plan 05-04). See macOS counterpart
          # above for the rationale — same grep, same exit semantics. On
          # Linux under llvmpipe the compat profile is fully supported, so
          # the granted format MUST report `gl_profile=compatibility`. A
          # silent fall-through to core would be a Phase 5 regression.
          grep 'BALLVIEW_GL_DIAG.*gl_profile=compatibility' /tmp/ballview-smoke.log

      # On a smoke-check failure, upload the (blank) PNG + captured BALLView log
      # so the failure can be debugged without re-running CI. The Plan 01 script
      # leaves both in a temp dir on failure (D-05 debugging intent).
      - name: Upload render-smoke artifacts on failure
        if: failure() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ballview-smoke.*
            /tmp/ballview-smoke.*
          if-no-files-found: ignore
          retention-days: 7

      # ======================================================================
      # OpenBabel smoke check (D-05) — macOS + Linux only (matrix.smoke).
      # Windows has OpenBabel OFF (not a vcpkg port) so this step is skipped
      # for windows-x64. The script compiles the standalone driver against
      # libBALL and asserts: (1) non-empty SMILES, (2) determinism, (3)
      # aromaticity-correct canonical SMILES via OBConversion round-trip.
      # Plan 04-03 (openbabel-smoke.C + openbabel-smoke.sh).
      # ======================================================================
      - name: OpenBabel smoke check (macOS)
        if: matrix.smoke && matrix.os == 'macos-arm64'
        run: |
          bash .planning/phases/04-dependency-system-overhaul/scripts/openbabel-smoke.sh \
            build/ci-macos 2>&1 | tee /tmp/04-03-smoke.log
          grep -q OPENBABEL_SMOKE_OK /tmp/04-03-smoke.log

      - name: OpenBabel smoke check (Linux)
        if: matrix.smoke && matrix.os == 'linux-x64'
        run: |
          bash .planning/phases/04-dependency-system-overhaul/scripts/openbabel-smoke.sh \
            build/ci-linux 2>&1 | tee /tmp/04-03-smoke.log
          grep -q OPENBABEL_SMOKE_OK /tmp/04-03-smoke.log

      - name: Upload openbabel-smoke artifacts on failure
        if: failure() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: openbabel-smoke-${{ matrix.os }}
          path: /tmp/04-03-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # lint — the legacy-Qt-symbol grep gates.
  #
  # Its own lightweight job: it needs no build, so a fast standalone job is
  # cleaner than a per-OS step. Blocking/required — a legacy symbol regression
  # fails CI. Each script takes the repo root as $1 and exits 0/1.
  #
  # Phase 5 (Plan 05-04): the Linux runner bumped from ubuntu-22.04 to
  # ubuntu-24.04 in step with the build matrix (D-02). The new Qt 5 holdout
  # gate (check-no-legacy-qt6-symbols.sh, scripts/) was added alongside the
  # Phase 2 legacy-GL gate — same pattern, different LEGACY_PATTERN set.
  # --------------------------------------------------------------------------
  lint:
    name: lint (legacy-Qt grep gates)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Legacy Qt GL symbol grep gate
        run: |
          bash .planning/phases/02-rendering-port-4a/scripts/check-no-legacy-gl-symbols.sh "$GITHUB_WORKSPACE"

      - name: Legacy Qt 5 symbol grep gate (Phase 5)
        run: |
          # Plan 05-04 Task 1 — catches QRegExp / QDesktopWidget /
          # QApplication::desktop / QString::SkipEmptyParts /
          # QtWidgets/QOpenGLWidget / QtWidgets/QDesktopWidget / Qt5:: under
          # source/ + include/BALL/. The Qt 6 migration (Plans 05-01..03)
          # eliminated every site; this step prevents regressions.
          bash scripts/check-no-legacy-qt6-symbols.sh "$GITHUB_WORKSPACE"

  # --------------------------------------------------------------------------
  # coverage — Phase 9 partial promotion (NON-BLOCKING) — code coverage on
  # Linux GCC using BALL's existing ENABLE_COVERAGE_TESTING CMake option
  # (CMakeLists.txt line 681 — wires -fprofile-arcs -ftest-coverage for
  # BALL + VIEW under GXX). Separate job from the main build matrix because:
  #   - Coverage instrumentation is 2-3x slower than Release; running it
  #     in the matrix would slow every PR
  #   - Coverage runs in parallel with the matrix on a separate runner —
  #     net wall-clock cost is ~0
  #   - Failures here are non-blocking (continue-on-error: true) — coverage
  #     gen errors should never block a PR that has otherwise-green CI
  # Produces gcovr HTML report + Cobertura XML, both uploaded as artifacts
  # for browsing + future Codecov / GitHub Code Insights integration.
  # --------------------------------------------------------------------------
  coverage:
    name: coverage (Linux, gcov, non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-coverage-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-coverage-ubuntu-24.04-

      - name: Install dependencies + gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make g++ ccache \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools libqt6opengl6-dev \
            libboost-all-dev libeigen3-dev libfftw3-dev libtbb-dev libglew-dev \
            libopenbabel-dev libsvm-dev flex bison \
            xvfb mesa-utils libgl1-mesa-dri \
            gcovr lcov

      - name: Configure (Linux + ENABLE_COVERAGE_TESTING)
        run: |
          # Reuse ci-linux preset but inject the coverage flag + force
          # Debug build (no -O optimization so coverage line mapping is
          # accurate). BALL_LICENSE=GPL keeps OpenBabel paths exercised.
          cmake --preset ci-linux \
            -DENABLE_COVERAGE_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBALL_LICENSE=GPL

      - name: Build BALL + tests (coverage build)
        run: |
          cmake --build build/ci-linux --target BALL VIEW BALLView -j$(nproc)
          cmake --build build/ci-linux --target build_tests -j$(nproc)

      - name: Run test suite under coverage
        run: |
          cd build/ci-linux
          export BALL_DATA_PATH="${{ github.workspace }}/data"
          # Don't fail the job on test failures — coverage % is the
          # signal of interest here, and the gatekeeper jobs (above)
          # are already capturing the pass/fail breakdown.
          ctest --output-on-failure --timeout 240 \
                --output-junit ${{ github.workspace }}/ball-tests-coverage.xml || true

      - name: Generate coverage report (gcovr HTML + Cobertura XML)
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --exclude '.*build/.*' \
            --exclude '.*test/.*' \
            --exclude '/usr/.*' \
            --exclude '.*moc_.*\.cpp' \
            --exclude '.*ui_.*\.h' \
            --html-details coverage-report/index.html \
            --xml-pretty --xml coverage-report/coverage.xml \
            --print-summary 2>&1 | tee coverage-summary.txt
          echo ""
          echo "Coverage summary:"
          grep -E "^lines:|^functions:|^branches:" coverage-summary.txt || \
            tail -5 coverage-summary.txt

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ github.run_id }}
          path: coverage-report/
          retention-days: 30

      - name: Upload coverage Cobertura XML (for Codecov / GitHub Insights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage-report/coverage.xml
          retention-days: 90

  # --------------------------------------------------------------------------
  # test-report — Phase 9 partial promotion — runs after the build matrix +
  # coverage job, downloads each platform's JUnit XML artifact, and publishes
  # a unified test-results summary as a Check Run on the PR / push (visible
  # inline in the GitHub UI without needing to download the XML manually).
  #
  # Uses EnricoMi/publish-unit-test-result-action — the canonical OSS action
  # for this pattern. Configured to NEVER fail the build itself
  # (fail_on: "nothing") since the gatekeeper steps are non-blocking; this
  # job is purely visualization.
  #
  # Skipped on forked-PR runs because cross-repo PRs don't have permissions
  # to write check runs on the upstream. The Linux build's --output-junit
  # output remains available as a downloadable artifact in that case.
  # --------------------------------------------------------------------------
  test-report:
    name: test-report (PR check summary)
    needs: [build, coverage]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ball-tests-*
          path: junit-artifacts
          merge-multiple: true

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            junit-artifacts/*.xml
          comment_mode: changes in failures
          check_name: "BALL test suite (Phase 9 gatekeeper)"
          fail_on: "nothing"
          report_individual_runs: true
