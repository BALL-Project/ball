name: Release

# Binary installer build for tagged releases. Trigger manually with
# `gh workflow run release.yml -f tag=v1.7.0` (or via the Actions UI).
# Future tags pushed in the v*.*.* shape will also auto-trigger.
#
# Scope: macOS arm64 + Windows x64 binary bundles, attached to a GitHub
# Release. Linux installers are Phase 8c.
#
# Signing status:
# - macOS (Phase 8a): LIVE since v1.7.1 — Developer ID Application +
#   notarytool + stapled .dmg. MANDATORY: the job fails if the 7 MACOS_*
#   secrets are absent (no unsigned fallback). See
#   .planning/phases/08a-packaging-macos/08a-SECRETS-RUNBOOK.md.
# - Windows (Phase 999.68 / WINSIGN-01): SignPath Foundation scaffold in place
#   but OPTIONAL-skip — enrollment + SIGNPATH_API_TOKEN secret still pending.
#   When the secret is absent the release ships the UNSIGNED NSIS installer
#   with a ::warning:: (does NOT fail). When present it signs via SignPath.
#   See .planning/phases/999.68-packaging-signing-license/SIGNPATH-SECRETS-RUNBOOK.md.
# - Linux (Phase 8c): AppImage / .deb / .rpm — still pending.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and package (e.g. v1.6.0)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as draft"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    # Phase 999.50 (BUILD-ACCEL-07, plan item ②): NEW job-level env block — none
    # existed on this job before. Carries the same ccache+PCH sloppiness contract
    # ci.yml's build job uses (ci.yml ~line 218) so the ccache cache restored below
    # actually lands hits instead of silently busting them. Without these keys,
    # PCH-enabled builds bust ccache; CCACHE_EXTRAFILES pins the generated config.h
    # so PROJECT VERSION bumps properly invalidate cached compilations. The values
    # are copied verbatim from ci.yml so a release tag of an already-CI-built commit
    # reuses CI's warmed object cache (key lineage aligned in the ccache steps below).
    env:
      CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime"
      CCACHE_EXTRAFILES: "${{ github.workspace }}/include/BALL/CONFIG/config.h.in"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-05-16: macOS reverted to macos-14 (Sonoma) to match OpenMS
          # parity (see ci.yml's matching comment). Windows stays on
          # windows-2025 (newer MSVC + SDK; OpenMS uses this too). The
          # macOS bundle's runtime target is macOS 26 (Tahoe) via the
          # D4-mac ad-hoc resign — exercised at user install time, not at
          # CI build time, so Sonoma CI is sufficient.
          - os: macos-arm64
            runner: macos-14
          - os: windows-x64
            runner: windows-2025
          # Phase 8c (PKG-LINUX-01): Linux SKUs ship LGPL-only (no FFTW)
          # per FFTW-GPL-DECISION.md (SHIP-LGPL-ONLY until a GPL-compliance
          # owner is named). AppImage + DEB + RPM full tooling is staged in
          # follow-on Phase 8c.2; this matrix entry produces a CPack tarball
          # so v1.7 RC has a Linux artifact even before the full installer
          # SKUs land.
          - os: linux-x64
            runner: ubuntu-24.04
          - os: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Resolve target ref
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # macOS ships .dmg (Phase 8a, PKG-MAC-03); Linux ships .tar.gz
          # (Phase 8c part-1, PKG-LINUX-01 — .AppImage / .deb / .rpm
          # follow-on in Phase 8c part-2); Windows .zip until 8b's NSIS
          # installer lands.
          case "${{ matrix.os }}" in
            macos-*) ASSET_EXT="dmg" ;;
            linux-*) ASSET_EXT="tar.gz" ;;
            *)       ASSET_EXT="zip" ;;
          esac
          echo "asset=BALLView-${REF}-${{ matrix.os }}.${ASSET_EXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: $REF (asset extension: ${ASSET_EXT})"

      - name: Checkout (at resolved tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      # =====================================================================
      # Phase 999.8-full: Ed25519 auto-update key presence gate.
      # Fails the job EARLY (before any expensive build/sign work) if the
      # production Ed25519 pubkey secret is missing on a non-dev tag. This
      # prevents accidentally shipping binaries that embed the placeholder
      # pubkey from Phase 999.8-full scaffolding — once such a binary is
      # in users' hands, ALL their installs become un-updatable forever.
      # See .planning/phases/999.8-auto-update-sparkle-winsparkle/ED25519-KEY-RUNBOOK.md.
      #
      # Dev tags (prefix `dev-`) and workflow_dispatch with draft=true skip
      # the gate — local pre-release smoke tests don't need the prod key.
      # =====================================================================
      - name: Ed25519 auto-update key presence gate (Phase 999.8-full)
        shell: bash
        env:
          AUTOUPDATE_ED25519_PUBLIC_KEY: ${{ secrets.AUTOUPDATE_ED25519_PUBLIC_KEY }}
        run: |
          REF="${{ steps.resolve.outputs.ref }}"
          IS_DRAFT="${{ github.event.inputs.draft || 'false' }}"
          case "$REF" in
            dev-*|*-dev|*-rc*|*-alpha*|*-beta*)
              echo "Dev/RC tag $REF — skipping Ed25519 key gate."
              exit 0 ;;
          esac
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft release requested — skipping Ed25519 key gate."
            exit 0
          fi
          if [ -z "$AUTOUPDATE_ED25519_PUBLIC_KEY" ]; then
            # v1.7.0 deferral (2026-05-19): Phase 999.8 (auto-update
            # via Sparkle/WinSparkle) is BLOCKED by Phase 8 (macOS
            # Developer ID signing + Windows SignPath signing), which
            # is itself deferred to v1.7.1 pending institutional
            # Apple Developer Program enrollment for Universität
            # Tübingen.
            #
            # When BOTH the pubkey and privkey are unset, no
            # auto-update infrastructure ships in the binary at all:
            # Sparkle's Info.plist gets no SUPublicEDKey entry,
            # auto-update is dormant, no placeholder pubkey can brick
            # future installs. The risk this gate was originally
            # written for (a stale placeholder pubkey embedded in
            # released binaries) does not exist when the field is
            # cleanly absent.
            #
            # The gate's hard-error behaviour stays in place for the
            # MIXED state (pubkey set but privkey unset, or vice
            # versa) — that's a real config bug that would surface
            # bricked auto-update.
            echo "::warning::AUTOUPDATE_ED25519_PUBLIC_KEY secret is unset on a production tag ($REF)."
            echo "::warning::Phase 999.8 (auto-update) is deferred until Phase 8 (signing) lands."
            echo "::warning::This release will ship WITHOUT auto-update infrastructure — users must manually update."
            echo "::warning::See .planning/phases/999.8-auto-update-sparkle-winsparkle/ED25519-KEY-RUNBOOK.md to enable."
            exit 0
          fi
          echo "Ed25519 production pubkey present — gate passed."

      # =====================================================================
      # macOS arm64 — Homebrew Qt 6, ci-macos preset, macdeployqt
      #
      # Phase 5.1 critical fix (codex review CRITICAL #1, 2026-05-15):
      # v1.6.0 tagged on a Qt 5 codebase (release ran `brew install qt@5`
      # against `FIND_PACKAGE(Qt5 ...)` in CMakeLists.txt and the qt@5 path
      # to macdeployqt). Phase 5 migrated the codebase to Qt 6 but this
      # workflow was never updated. Any v1.6.1 release attempt would have
      # failed at CMake configure because the codebase now requires Qt 6
      # (FIND_PACKAGE(Qt6 ... REQUIRED ...) at CMakeLists.txt:319). Mirror
      # ci.yml's Qt 6 Homebrew setup: `brew install qt` (unversioned name
      # is Qt 6 on current Homebrew) and `qt/bin/macdeployqt`.
      # =====================================================================
      - name: Install dependencies (macOS / Homebrew)
        if: matrix.os == 'macos-arm64'
        run: |
          # Phase 8a (PKG-MAC-03): + create-dmg for the signed .dmg artifact.
          brew install qt boost eigen fftw tbb glew open-babel lp_solve libsvm flex bison ccache create-dmg

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): restore the ccache object cache
      # BEFORE configure so a release tag of an already-CI-built commit warms from
      # CI's compiler cache. Split restore/save mirrors the vcpkg cache pattern in
      # this file (Windows block below). Key is IDENTICAL to ci.yml's lineage
      # (ccache-<os>-pch-v2-<sha> + restore-keys ccache-<os>-pch-v2- / ccache-<os>-)
      # so the same-SHA or most-recent CI ccache is reusable. The ci-macos preset
      # already wires CMAKE_<LANG>_COMPILER_LAUNCHER=ccache — no launcher wiring here.
      - name: Restore ccache (macOS)
        id: ccache-mac
        if: matrix.os == 'macos-arm64'
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-pch-v2-
            ccache-${{ matrix.os }}-

      - name: Configure (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          cmake --preset ci-macos -DBALL_LICENSE=GPL

      - name: Build (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          cmake --build --preset ci-macos --target BALL VIEW BALLView -j$(sysctl -n hw.ncpu)

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): save the warmed ccache AFTER the
      # build. Gated `cache-hit != 'true'` (mirroring the vcpkg save gate) so an
      # exact-key hit doesn't redundantly re-upload an unchanged cache.
      - name: Save ccache (macOS)
        if: always() && matrix.os == 'macos-arm64' && steps.ccache-mac.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}

      # ----------------------------------------------------------------------
      # Phase 9 gatekeeper (BLOCKING — TEST-CLOSE-02) — mirrors the ci.yml
      # gatekeeper so release builds ALSO surface unit test regressions.
      # Tests run AFTER the BALLView build (the binary the user gets in the
      # installer must build green; tests give us confidence in correctness
      # of the binary that ships).
      # Three baseline failures triaged in 09-TRIAGE.md (Phase 9, 2026-05-16).
      # Windows test gatekeeper landed in Phase 999.34 (see Windows block below).
      # ----------------------------------------------------------------------
      # TEST-CLOSE-02 (Phase 9, 2026-05-16): gatekeeper flipped to blocking
      # after 3 baseline failures triaged in 09-TRIAGE.md.
      #
      # v1.7.x-09 (2026-05-19): test-build + test-run gated on
      # BALLVIEW_RELEASE_GATEKEEPER_TESTS env var, default OFF. CI's
      # ci.yml runs the BALL test suite on every push for the same
      # commit; release.yml's tag-push duplicates that work and adds
      # ~25 min to Windows critical path + ~4 min to macOS for no
      # additional safety. The user-feedback gate (UFG) covers
      # functional regressions CI can't catch via runtime exercise of
      # the DMG. Re-enable for paranoid releases by setting
      # BALLVIEW_RELEASE_GATEKEEPER_TESTS=1 at workflow_dispatch time
      # OR by editing the conditional below.
      - name: Build BALL test suite (macOS — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'macos-arm64' && env.BALLVIEW_RELEASE_GATEKEEPER_TESTS == '1'
        continue-on-error: false
        timeout-minutes: 45
        run: |
          cmake --build build/ci-macos --target build_tests -j$(sysctl -n hw.ncpu)

      # TEST-CLOSE-02 (Phase 9, 2026-05-16): gatekeeper flipped to blocking
      # after 3 baseline failures triaged in 09-TRIAGE.md.
      - name: Run BALL test suite (macOS — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'macos-arm64' && env.BALLVIEW_RELEASE_GATEKEEPER_TESTS == '1'
        continue-on-error: false
        timeout-minutes: 60
        run: |
          cd build/ci-macos
          # BALL_DATA_PATH MUST be set — see ci.yml gatekeeper for the
          # post-mortem (v1.6.0 local baseline: 50/294 fail without it,
          # 3/294 fail with it).
          export BALL_DATA_PATH="${{ github.workspace }}/data"
          # TEST-CLOSE-02: || true removed — this step is now blocking.
          ctest --output-on-failure --timeout 120 \
                --output-junit ${{ github.workspace }}/ball-tests-macos-release.xml

      - name: Upload test results (macOS — release)
        if: always() && matrix.os == 'macos-arm64'
        uses: actions/upload-artifact@v6
        with:
          name: ball-tests-macos-release-${{ steps.resolve.outputs.ref }}-${{ github.run_id }}
          path: ball-tests-macos-release.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Locate BALLView.app (macOS)
        if: matrix.os == 'macos-arm64'
        id: locate-mac
        shell: bash
        run: |
          APP=$(find build/ci-macos -name "BALLView.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::BALLView.app not found in build/ci-macos"
            find build/ci-macos -name "BALLView*" -maxdepth 8 2>/dev/null || true
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      # ----------------------------------------------------------------------
      # Phase 8a — macOS code signing + notarization + .dmg packaging.
      # See .planning/phases/08a-packaging-macos/08a-01-PLAN.md and
      # .planning/phases/08a-packaging-macos/08a-SECRETS-RUNBOOK.md.
      #
      # Phase 8a went LIVE in v1.7.1 (2026-05-21): the Developer ID cert + all
      # 7 MACOS_* secrets are provisioned (see 08a-SECRETS-RUNBOOK.md), so
      # signing + notarization is now MANDATORY for macOS release artifacts.
      # Unsigned shipping is no longer an accepted fallback — if the cert
      # secret is missing we FAIL the job loudly rather than silently produce
      # an unsigned .dmg.
      # ----------------------------------------------------------------------
      - name: Detect macOS signing readiness
        if: matrix.os == 'macos-arm64'
        id: mac-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::error::MACOS_CERTIFICATE_BASE64 is not set. macOS release artifacts MUST be signed + notarized (Phase 8a, live since v1.7.1). Restore the 7 MACOS_* secrets per .planning/phases/08a-packaging-macos/08a-SECRETS-RUNBOOK.md."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "macOS signing ENABLED — Developer ID cert + notarization path"

      - name: Import Apple Developer ID cert into CI keychain (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Create an ephemeral keychain so we never touch the runner's
          # default login keychain (security best practice for CI).
          KEYCHAIN_PATH="${RUNNER_TEMP}/ball-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # Allow codesign to access the private key without password prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Make our keychain the default search target for the duration
          # of the job.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Sanity check — the signing identity must now be visible.
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

          # Wipe the .p12 from disk; the keychain copy is all we need.
          rm -P "$CERT_PATH" 2>/dev/null || rm -f "$CERT_PATH"

      - name: macdeployqt (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          # Phase 5.1 carry-forward: qt (unversioned) is Qt 6 on current Homebrew.
          # NOTE: we do NOT pass `-codesign=` here — macdeployqt's per-binary
          # signing happens too early in the pipeline (before data/ is bundled
          # and entitlements are applied). Phase 8a's `Codesign BALLView.app`
          # step below performs the seal-the-whole-bundle signing with
          # --deep + entitlements + hardened runtime.
          /opt/homebrew/opt/qt/bin/macdeployqt "${{ steps.locate-mac.outputs.app }}" -verbose=1

      - name: Bundle data/ into the .app (macOS)
        if: matrix.os == 'macos-arm64'
        shell: bash
        run: |
          if [ -d data ]; then
            mkdir -p "${{ steps.locate-mac.outputs.app }}/Contents/Resources/data"
            cp -R data/* "${{ steps.locate-mac.outputs.app }}/Contents/Resources/data/"
            echo "Bundled $(du -sh data | awk '{print $1}') of runtime data into the .app"
          else
            echo "::warning::data/ not found at repo root — .app may be missing runtime resources"
          fi

      # =====================================================================
      # Phase 999.8-full: vendor Sparkle.xcframework into the bundle.
      # CMake's BALLViewInstallFix.cmake.in handles local `cmake --install`
      # paths, but the CI release path uses macdeployqt directly without
      # going through that script. We replicate the install-time copy here
      # so Sparkle.framework is in Contents/Frameworks/ BEFORE the codesign
      # `--deep --force` sweep — otherwise notarization sees an unsigned
      # framework and rejects the bundle (R-sparkle-helper-sign mitigation,
      # 999.8-SPIKE.md §5).
      #
      # No-op when packaging/macos/Sparkle.xcframework doesn't exist yet
      # (first-run before vendor-sparkle.sh has been executed). The
      # auto-update path is then a runtime no-op (BALL_HAS_SPARKLE off).
      # =====================================================================
      - name: Bundle Sparkle.framework into the .app (macOS — Phase 999.8-full)
        if: matrix.os == 'macos-arm64'
        shell: bash
        run: |
          SRC="packaging/macos/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework"
          DEST="${{ steps.locate-mac.outputs.app }}/Contents/Frameworks"
          if [ -d "$SRC" ]; then
            mkdir -p "$DEST"
            cp -R "$SRC" "$DEST/"
            echo "Bundled Sparkle.framework into BALLView.app"
            ls -la "$DEST/Sparkle.framework"
          else
            echo "::warning::Sparkle.xcframework not vendored — auto-update DISABLED for this build."
            echo "::warning::Run packaging/macos/vendor-sparkle.sh on a maintainer workstation and commit the result before the v1.7.0 production tag."
          fi

      - name: Codesign BALLView.app with Developer ID + hardened runtime (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # MUST run AFTER macdeployqt + data/ bundling — both modify the
          # bundle contents and would invalidate any earlier signature seal.
          # Phase 8a (PKG-MAC-01) — replaces the v1.6 ad-hoc resign step.
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements packaging/macos/BALLView.entitlements \
            --timestamp \
            "${{ steps.locate-mac.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 \
            "${{ steps.locate-mac.outputs.app }}" 2>&1 | tail -20

      # (v1.7.1) The pre-cert ad-hoc unsigned-resign fallback was removed —
      # signing is mandatory now; the readiness gate above fails the job if
      # the cert is absent, so there is no unsigned path to fall back to.

      - name: Zip .app for notary submission (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        run: |
          # notarytool requires .zip/.dmg/.pkg input. We zip the .app
          # separately here (not the final .dmg) because the .dmg gets
          # created *after* the .app's notarization ticket is stapled —
          # otherwise stapler would have to staple the .dmg's enclosed
          # .app post-mount, which create-dmg does not support.
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.locate-mac.outputs.app }}" \
            "${{ runner.temp }}/BALLView-notarize.zip"

      - name: Submit to Apple notary + wait (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        timeout-minutes: 60
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          # Steady-state: 5-15 min. First-ever submission for a fresh
          # bundle ID can take 8-12h — that priming submission must be
          # done MANUALLY (see 08a-SECRETS-RUNBOOK.md Section 5) before
          # the first tagged release.
          xcrun notarytool submit \
            "${{ runner.temp }}/BALLView-notarize.zip" \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait

      - name: Staple notarization ticket + spctl assess fail-fast (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        run: |
          xcrun stapler staple "${{ steps.locate-mac.outputs.app }}"
          xcrun stapler validate "${{ steps.locate-mac.outputs.app }}"
          # Fail-fast at CI time, not user-install time, if Gatekeeper
          # would reject the bundle. The grep MUST find the magic string.
          spctl --assess --type execute --verbose=4 \
            "${{ steps.locate-mac.outputs.app }}" 2>&1 | tee /tmp/spctl-assess.log
          grep -q 'source=Notarized Developer ID' /tmp/spctl-assess.log

      # =====================================================================
      # Phase 999.8-full: Sparkle.framework smoke test.
      # Asserts the vendored framework is (a) present and (b) co-signed by
      # the Phase 8a `codesign --deep --force` pass. Runs AFTER the codesign
      # step so it validates the actual post-signing state.
      # Skipped on the unsigned-fallback path (no framework, no signature
      # to verify).
      # =====================================================================
      - name: Sparkle.framework smoke test (macOS — Phase 999.8-full)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APP="${{ steps.locate-mac.outputs.app }}"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$FW" ]; then
            echo "::warning::Sparkle.framework not bundled — auto-update disabled for this build."
            echo "::warning::This is expected before packaging/macos/vendor-sparkle.sh runs once."
            exit 0
          fi
          echo "Sparkle.framework present — verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$FW" 2>&1 | tail -10
          # Autoupdate.app helper has its own Mach-O signature — explicitly
          # verify it (R-sparkle-helper-sign — 999.8-SPIKE.md §5).
          AUTOUPDATE=$(find "$FW" -name "Autoupdate.app" -type d | head -1)
          if [ -n "$AUTOUPDATE" ]; then
            echo "Verifying Autoupdate.app helper signature..."
            codesign --verify --deep --strict --verbose=2 "$AUTOUPDATE" 2>&1 | tail -5
          fi
          echo "Sparkle.framework smoke test PASSED."

      - name: Build signed .dmg via create-dmg (macOS)
        if: matrix.os == 'macos-arm64'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # create-dmg --codesign signs the .dmg outer wrapper with the
          # Developer ID identity. The enclosed .app is already signed +
          # stapled from prior steps. If signing is disabled (fallback
          # path), --codesign is omitted and the .dmg ships unsigned.
          APP="${{ steps.locate-mac.outputs.app }}"
          APP_DIR=$(dirname "$APP")
          # create-dmg refuses to overwrite — clean any stale output.
          DMG="${{ github.workspace }}/${{ steps.resolve.outputs.asset }}"
          rm -f "$DMG"

          CODESIGN_FLAG=()
          if [ "${{ steps.mac-signing.outputs.enabled }}" = "true" ]; then
            CODESIGN_FLAG=(--codesign "$MACOS_SIGNING_IDENTITY")
          fi

          # Stage the .app alone in a clean source dir so create-dmg only
          # includes BALLView.app (not stray build artifacts in APP_DIR).
          STAGE="${RUNNER_TEMP}/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"

          create-dmg \
            --volname "BALLView ${{ steps.resolve.outputs.ref }}" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 --icon "BALLView.app" 175 190 \
            --hide-extension "BALLView.app" \
            --app-drop-link 425 190 \
            "${CODESIGN_FLAG[@]}" \
            "$DMG" "$STAGE"
          ls -lh "$DMG"

      # =====================================================================
      # Linux x86_64 + arm64 — Phase 8c (PKG-LINUX-01) part-1
      # SHIP-LGPL-ONLY per .planning/phases/08c-packaging-linux/
      # 08c-FFTW-GPL-DECISION.md (no GPL-compliance owner named for v1.7).
      # Configure runs without FFTW; build produces BALL+VIEW+BALLView and
      # CPack rolls a portable .tar.gz. AppImage + .deb + .rpm full
      # packaging deferred to Phase 8c part-2 (linuxdeploy-plugin-qt +
      # CPack DEB/RPM generators).
      # =====================================================================
      - name: Install dependencies (Linux / apt)
        if: startsWith(matrix.os, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build flex bison ccache \
            libboost-all-dev libeigen3-dev libglew-dev libtbb-dev \
            libopenbabel-dev liblpsolve55-dev libsvm-dev \
            xvfb mesa-utils libgl1-mesa-dev libglu1-mesa-dev \
            patchelf
          # NOTE: NO libfftw3-dev — SHIP-LGPL-ONLY per FFTW-GPL-DECISION.md.

      - name: Install Qt 6 (Linux — jurplel/install-qt-action / aqtinstall)
        if: startsWith(matrix.os, 'linux-')
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: ${{ matrix.os == 'linux-arm64' && 'linux_arm64' || 'linux' }}
          target: desktop
          modules: 'qtimageformats'
          cache: true

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): restore ccache BEFORE configure
      # (key aligned with ci.yml's ccache-<os>-pch-v2- lineage — see the macOS block
      # above for the full rationale). ci-linux preset wires the compiler launcher.
      - name: Restore ccache (Linux)
        id: ccache-linux
        if: startsWith(matrix.os, 'linux-')
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-pch-v2-
            ccache-${{ matrix.os }}-

      - name: Configure (Linux)
        if: startsWith(matrix.os, 'linux-')
        run: |
          # Phase 8c part-2 bugfix (v1.7.0-rc1 post-mortem, 2026-05-18):
          # BALL_ENABLE_PACKAGING gates `INCLUDE(BALLPackageConfig)` in the
          # top-level CMakeLists.txt (line 983-985). Without it the CPack
          # generator list ("TGZ;DEB;RPM") is never registered and `cpack`
          # below dies with "CPack generator not specified". Surfaced in
          # release run 26005037681 on the v1.7.0-rc1 tag.
          cmake --preset ci-linux \
            -DBALL_HAS_FFTW=OFF \
            -DBALL_ENABLE_PACKAGING=ON \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build (Linux)
        if: startsWith(matrix.os, 'linux-')
        run: cmake --build --preset ci-linux --target BALL VIEW BALLView

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): save the warmed ccache AFTER the
      # build, gated `cache-hit != 'true'` (mirroring the vcpkg save gate).
      - name: Save ccache (Linux)
        if: always() && startsWith(matrix.os, 'linux-') && steps.ccache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}

      # ---------------------------------------------------------------------
      # Phase 8c part-2 (PKG-LINUX-02 + PKG-LINUX-03): install additional
      # tooling needed by CPack DEB + CPack RPM generators. dpkg-dev ships
      # `dpkg` (the DEB generator), `rpm` brings rpmbuild (the RPM generator
      # works on Ubuntu via rpmbuild from the `rpm` package; the resulting
      # .rpm installs fine on Fedora 40+ — distro-independent rpmbuild is
      # a deliberate CPack design).
      # ---------------------------------------------------------------------
      - name: Install CPack DEB + RPM tooling (Linux)
        if: startsWith(matrix.os, 'linux-')
        run: |
          sudo apt-get install -y dpkg-dev rpm desktop-file-utils file

      - name: Package (Linux — CPack TGZ + DEB + RPM)
        if: startsWith(matrix.os, 'linux-')
        shell: bash
        run: |
          cd build/ci-linux
          # Phase 8c part-2 bugfix (v1.7.0-rc1 post-mortem, 2026-05-18):
          # The previous `cmake --install . --prefix /usr --strip || true`
          # line was vestigial and harmful — it tried to install to the
          # runner's real /usr/bin (EACCES on a non-root runner), and CPack
          # already runs its own internal install into _CPack_Packages/
          # before rolling the .tar.gz / .deb / .rpm. The `|| true` was
          # supposed to swallow the failure but the resulting `CMake Error`
          # message confused the post-mortem. Drop the line entirely; CPack
          # handles staging via CMAKE_INSTALL_PREFIX=/usr set at configure.
          #
          # CPACK_GENERATOR ("TGZ;DEB;RPM") is registered by
          # cmake/BALLPackageConfig.cmake, which is now included thanks to
          # BALL_ENABLE_PACKAGING=ON at configure time. Single cpack call
          # emits all 3 generators.
          cpack -B "$GITHUB_WORKSPACE/dist"
          ls -lh "$GITHUB_WORKSPACE/dist"
          # Locate each artifact (CPack uses CPACK_PACKAGE_FILE_NAME for
          # the basename — BALLView-lgpl-${VERSION}-linux-${ARCH}.{ext}).
          TGZ=$(ls "$GITHUB_WORKSPACE/dist"/*.tar.gz 2>/dev/null | head -1)
          DEB=$(ls "$GITHUB_WORKSPACE/dist"/*.deb     2>/dev/null | head -1)
          RPM=$(ls "$GITHUB_WORKSPACE/dist"/*.rpm     2>/dev/null | head -1)
          if [ -z "$TGZ" ]; then
            echo "::error::No .tar.gz produced by cpack"
            exit 1
          fi
          # Primary asset (existing upload step expects steps.resolve.outputs.asset).
          cp "$TGZ" "$GITHUB_WORKSPACE/${{ steps.resolve.outputs.asset }}"
          # Stage DEB + RPM under predictable names for the dedicated upload
          # steps below (asset names mirror the resolve.outputs.asset shape:
          # BALLView-${REF}-${OS}.{deb,rpm}).
          if [ -n "$DEB" ]; then
            cp "$DEB" "$GITHUB_WORKSPACE/BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.deb"
          else
            echo "::warning::cpack -G DEB produced no .deb — generator may have failed silently"
          fi
          if [ -n "$RPM" ]; then
            cp "$RPM" "$GITHUB_WORKSPACE/BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.rpm"
          else
            echo "::warning::cpack -G RPM produced no .rpm — generator may have failed silently"
          fi
          ls -lh "$GITHUB_WORKSPACE/${{ steps.resolve.outputs.asset }}"
          ls -lh "$GITHUB_WORKSPACE"/BALLView-*.deb "$GITHUB_WORKSPACE"/BALLView-*.rpm 2>/dev/null || true

      # ---------------------------------------------------------------------
      # Phase 8c part-2 (PKG-LINUX-01): AppImage via linuxdeploy +
      # linuxdeploy-plugin-qt (the canonical Qt 6 path — bundles Qt 6.8 +
      # QML + plugins/ + translations/ into AppDir, then rolls a portable
      # .AppImage). Pinned to continuous (linuxdeploy releases on a rolling
      # `continuous` tag — there's no semver, the upstream convention is
      # always-latest from the `continuous` GitHub release).
      # ---------------------------------------------------------------------
      - name: Build AppImage (Linux — linuxdeploy + linuxdeploy-plugin-qt)
        if: startsWith(matrix.os, 'linux-')
        shell: bash
        env:
          # linuxdeploy-plugin-qt looks at this to find qmake6 / Qt6 install
          # tree. jurplel/install-qt-action exports Qt6_DIR + QT_ROOT_DIR;
          # forward Qt6_DIR's parent to QMAKE so the plugin's qmake probe
          # finds the right Qt.
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake6
        run: |
          set -e
          ARCH_TAG="${{ matrix.os == 'linux-arm64' && 'aarch64' || 'x86_64' }}"
          LD_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH_TAG}.AppImage"
          LDQT_URL="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH_TAG}.AppImage"
          mkdir -p "$RUNNER_TEMP/ld"
          cd "$RUNNER_TEMP/ld"
          curl -fL -o linuxdeploy.AppImage "$LD_URL"
          curl -fL -o linuxdeploy-plugin-qt.AppImage "$LDQT_URL"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          # GitHub runners lack FUSE for AppImage self-mount; use the
          # --appimage-extract-and-run escape hatch (documented linuxdeploy
          # path for CI).
          export APPIMAGE_EXTRACT_AND_RUN=1

          # Build the AppDir against the installed tree from `cmake --install`.
          APPDIR="$RUNNER_TEMP/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          DESTDIR="$APPDIR" cmake --install "$GITHUB_WORKSPACE/build/ci-linux" --prefix /usr --strip

          # Bundle data/ adjacent to the binary so BALL_DATA_PATH discovery
          # works inside the AppImage. AppRun script sets BALL_DATA_PATH at
          # launch (linuxdeploy synthesises a default AppRun; we wrap it).
          mkdir -p "$APPDIR/usr/share/BALL"
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            cp -R "$GITHUB_WORKSPACE/data" "$APPDIR/usr/share/BALL/"
          fi

          # Run linuxdeploy with the Qt plugin.
          # Phase 8c part-2 bugfix (v1.7.0-rc1 post-mortem, 2026-05-18):
          # `cmake --install` puts libBALL.so.* + libVIEW.so.* under
          # AppDir/usr/lib/x86_64-linux-gnu/ (the Debian/Ubuntu multiarch
          # path inferred from GNUInstallDirs), but linuxdeploy's standard
          # search root is AppDir/usr/lib/ only — it does NOT recurse into
          # the multiarch subdir, so it fails with
          #   ERROR: Could not find dependency: libVIEW.so.1.6
          # Two fixes are needed:
          #   1. Export LD_LIBRARY_PATH so linuxdeploy's ldd-style probe
          #      finds the SOs at all.
          #   2. Pass each .so explicitly via `--library` so linuxdeploy
          #      copies them into the AppImage payload (LD_LIBRARY_PATH
          #      alone resolves the symbol but doesn't trigger bundling).
          MULTIARCH_LIB="$APPDIR/usr/lib/$(uname -m)-linux-gnu"
          export LD_LIBRARY_PATH="$MULTIARCH_LIB:${LD_LIBRARY_PATH:-}"
          LIB_FLAGS=()
          for so in "$MULTIARCH_LIB"/libBALL.so.* "$MULTIARCH_LIB"/libVIEW.so.*; do
            [ -f "$so" ] && LIB_FLAGS+=(--library "$so")
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ld/linuxdeploy.AppImage" \
            --appdir "$APPDIR" \
            --desktop-file "$GITHUB_WORKSPACE/packaging/linux/BALLView.desktop" \
            --icon-file "$GITHUB_WORKSPACE/packaging/linux/BALLView.svg" \
            "${LIB_FLAGS[@]}" \
            --plugin qt \
            --output appimage

          # Wrap the default AppRun to export BALL_DATA_PATH before exec.
          # linuxdeploy already produced the .AppImage; for v1.7 we ship
          # what linuxdeploy emits and document the BALL_DATA_PATH env in
          # the release notes. Custom AppRun wrapping = follow-on (999.x).

          APPIMAGE=$(ls BALLView*.AppImage 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::linuxdeploy produced no .AppImage"
            ls -la
            exit 1
          fi
          DEST="$GITHUB_WORKSPACE/BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.AppImage"
          mv "$APPIMAGE" "$DEST"
          ls -lh "$DEST"

      - name: Upload workflow artifact (Linux .deb)
        if: startsWith(matrix.os, 'linux-')
        uses: actions/upload-artifact@v6
        with:
          name: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.deb
          path: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload workflow artifact (Linux .rpm)
        if: startsWith(matrix.os, 'linux-')
        uses: actions/upload-artifact@v6
        with:
          name: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.rpm
          path: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.rpm
          if-no-files-found: warn
          retention-days: 30

      - name: Upload workflow artifact (Linux .AppImage)
        if: startsWith(matrix.os, 'linux-')
        uses: actions/upload-artifact@v6
        with:
          name: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.AppImage
          path: BALLView-${{ steps.resolve.outputs.ref }}-${{ matrix.os }}.AppImage
          if-no-files-found: warn
          retention-days: 30

      # =====================================================================
      # Windows x64 — vcpkg manifest, ci-windows preset, windeployqt
      # =====================================================================

      # Phase 999.28 follow-up — cross-ref vcpkg cache seed for the release
      # pipeline. release.yml runs on TAG-push refs whose actions/cache
      # scope is disjoint from any branch's scope, so CI's warm vcpkg
      # cache on v1.6-modernization is invisible here. Workaround: CI
      # uploads %LOCALAPPDATA%\vcpkg\archives as a workflow ARTIFACT
      # (cross-ref accessible via gh API). This step downloads the most
      # recent successful vcpkg-archives-windows artifact from the CI
      # workflow and stages it under %LOCALAPPDATA%\vcpkg\archives BEFORE
      # the actions/cache restore step. vcpkg then hits the seeded local
      # archives during cmake configure and skips the ~2h from-source
      # Qt6+Boost compile that has OOM'd this pipeline 4× on v1.6.2.
      #
      # Fail-soft: if no artifact exists (first run after this change,
      # or beyond the 14-day retention window), continue without seeding
      # and fall back to cold vcpkg.
      - name: Seed vcpkg archives from CI artifact (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stageDir = "C:\Users\runneradmin\AppData\Local\vcpkg\archives"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Write-Host "Looking for latest successful CI run on v1.6-modernization with vcpkg-archives-windows artifact..."

          # Find the most recent successful CI workflow run on the branch
          # that has the vcpkg-archives-windows artifact still within
          # retention.
          $runs = gh run list --workflow=CI --branch=v1.6-modernization --status=success --limit=20 --json databaseId | ConvertFrom-Json

          $found = $false
          foreach ($r in $runs) {
            $rid = $r.databaseId
            $artifacts = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$rid/artifacts" --jq '.artifacts[] | select(.name == "vcpkg-archives-windows" and .expired == false) | .id' 2>$null
            if ($artifacts) {
              Write-Host "Found vcpkg-archives-windows artifact in CI run $rid"
              gh run download $rid --repo $env:GITHUB_REPOSITORY --name vcpkg-archives-windows --dir $stageDir
              if ($LASTEXITCODE -eq 0) {
                $count = (Get-ChildItem -Path $stageDir -Recurse -File | Measure-Object).Count
                Write-Host "Staged $count vcpkg archive files under $stageDir"
                $found = $true
                break
              } else {
                Write-Host "Download failed for run $rid (exit $LASTEXITCODE); trying older run..."
              }
            }
          }
          if (-not $found) {
            Write-Host "::warning::No vcpkg-archives-windows artifact found within retention; will cold-build vcpkg"
          }

      - name: Restore vcpkg binary cache (Windows)
        id: vcpkg-cache
        if: matrix.os == 'windows-x64'
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      # Windows tooling install: flex/bison + ccache via a single composite
      # action. See .github/actions/setup-windows-deps/action.yml — that is
      # the canonical place to add future Windows-only tools.
      - name: Set up Windows build deps (flex/bison + ccache + ninja)
        if: matrix.os == 'windows-x64'
        uses: ./.github/actions/setup-windows-deps

      # Phase 999.2: with Ninja replacing MSBuild, cl.exe is invoked directly
      # and needs the vcvars64.bat environment (PATH, INCLUDE, LIB, LIBPATH).
      # MSBuild had this implicit via VS project files; Ninja does not.
      # Without this step, CMake falls back to whatever C++ compiler is on
      # PATH (often MinGW gcc on GitHub Windows runners), which fails on
      # Windows headers (`LARGE_INTEGER not declared`, etc.) — exactly what
      # blocked release run 25955116618. ilammy/msvc-dev-cmd@v1 is the
      # canonical GitHub Actions wrapper around vcvarsall.bat x64. Mirrors
      # the ci.yml setup added in Phase 999.2-03.
      - name: Set up MSVC environment (Windows — vcvars64 for Ninja)
        if: matrix.os == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Free disk space before vcpkg (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # v1.6.2 release-pipeline learning: starting free disk on windows-2025
          # is ~32 GB (NOT ~14 GB as docs suggested), but cold vcpkg Qt6 + Boost
          # easily consumes 30+ GB of buildtrees and OOM-kills the runner's
          # diag-log writer. Previous cleanup (Android SDK, JDK) only gained
          # 1.2 GB because those paths don't exist on windows-2025.
          # This iteration removes the actual large bloat: hosted toolcache
          # languages we don't use (Python <3.12, Ruby, PyPy, Java JDK, Go),
          # browser installs (Chrome, Firefox), pre-installed DB servers,
          # Strawberry Perl. Verified-present paths only; absent paths
          # SilentlyContinue (no failure).
          $before = (Get-PSDrive C).Free / 1GB
          Write-Host ("Free space before cleanup: {0:N1} GB" -f $before)

          $targets = @(
            # Hosted toolcache languages (each typically 1-3 GB)
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\hostedtoolcache\windows\Java_Adopt_jdk",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            # Old Python versions (keep 3.12+ in case vcpkg or cmake helper needs)
            "C:\hostedtoolcache\windows\Python\3.7.*",
            "C:\hostedtoolcache\windows\Python\3.8.*",
            "C:\hostedtoolcache\windows\Python\3.9.*",
            "C:\hostedtoolcache\windows\Python\3.10.*",
            "C:\hostedtoolcache\windows\Python\3.11.*",
            # Browser installs (cmake build doesn't use them)
            "C:\Program Files\Google\Chrome",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files (x86)\Google",
            "C:\Program Files (x86)\Mozilla Firefox",
            # Pre-installed DB servers (BALL build doesn't use them)
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\Microsoft SQL Server",
            # Strawberry Perl (cmake's Perl finder picks chocolatey or Git Bash perl first)
            "C:\Strawberry",
            # JDK variants outside hostedtoolcache
            "C:\Program Files\Java",
            "C:\Program Files\Eclipse Adoptium",
            "C:\Program Files\Microsoft\jdk*",
            # Old VS variants if present (keep 2022, primary)
            "C:\Program Files (x86)\Microsoft Visual Studio\2019"
          )

          foreach ($t in $targets) {
            if (Test-Path $t) {
              try {
                Remove-Item -Recurse -Force $t -ErrorAction Stop
                Write-Host ("  removed: {0}" -f $t)
              } catch {
                Write-Host ("  skip (in use): {0}" -f $t)
              }
            }
          }

          $after = (Get-PSDrive C).Free / 1GB
          Write-Host ("Free space after cleanup:  {0:N1} GB (gained {1:N1} GB)" -f $after, ($after - $before))

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): restore ccache BEFORE configure
      # (key aligned with ci.yml's ccache-<os>-pch-v2- lineage — see the macOS block
      # above for the full rationale). ci-windows preset wires the compiler launcher.
      - name: Restore ccache (Windows)
        id: ccache-win
        if: matrix.os == 'windows-x64'
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-pch-v2-
            ccache-${{ matrix.os }}-

      - name: Install Qt 6 (Windows — jurplel/install-qt-action / aqtinstall)
        if: matrix.os == 'windows-x64'
        # 999.66 — Windows Qt via aqtinstall. Mirror of ci.yml + the Linux
        # release step above: install the official prebuilt Qt 6.8 desktop kit
        # (MSVC 2022 x64) instead of building qtbase/qtsvg/qttools from source
        # via vcpkg. Eliminates the ~1.5-2h cold Qt build and the
        # windeployqt-missing failure class — windeployqt.exe ships in the aqt
        # kit's own bin/, so the host-triplet DLL-staging dance below is gone.
        # The release matrix has no qt_version field, so '6.8.*' is hardcoded
        # (same D-01 6.8 LTS floor as Linux/ci.yml). `modules:` intentionally
        # omitted — BALL's Qt modules are all in the default install.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          # 999.66 — Windows Qt via aqtinstall. Qt is no longer in vcpkg.json,
          # so the vcpkg toolchain no longer provides Qt6 config files. The aqt
          # action exports QT_ROOT_DIR (+ Qt6_DIR); pass it as CMAKE_PREFIX_PATH
          # so FIND_PACKAGE(Qt6) resolves the prebuilt kit. vcpkg toolchain is
          # still used for Boost/Eigen/FFTW/TBB/GLEW/winsparkle/etc.
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          # Pass --clean-after-build via CMake cache variable, NOT env var.
          # vcpkg's manifest-mode cmake integration honors the CMake
          # VCPKG_INSTALL_OPTIONS variable; the env-var spelling is for
          # the standalone `vcpkg install` CLI and was silently ignored in
          # the v1.6.2 attempt-2 release (cold-vcpkg OOM'd despite the
          # env setting). The list-form ";" separator is required so cmake
          # treats it as a list value.
          # Phase 8c part-2 bugfix (v1.7.0-rc1 post-mortem, 2026-05-18):
          # BALL_ENABLE_PACKAGING gates `INCLUDE(BALLPackageConfig)` which
          # in turn registers all CPACK_NSIS_* variables (per-user install
          # root, MUI icons, Start Menu links, EXTRA_INSTALL_COMMANDS, etc.)
          # used by the `Build NSIS installer (Windows)` step below. Without
          # this the resulting installer ships with CPack defaults only
          # (machine-wide install, no icons, no Start Menu shortcuts) and
          # the post-build filename grep on `BALLView-*-installer.exe`
          # silently slips into the legacy `BALL-*.exe` fallback.
          cmake --preset ci-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DUSE_QTWEBENGINE=OFF `
            -DBISON_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_bison.exe" `
            -DFLEX_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_flex.exe" `
            -DBALL_ENABLE_PACKAGING=ON `
            "-DVCPKG_INSTALL_OPTIONS=--clean-after-build"

      - name: Save vcpkg binary cache (Windows)
        if: always() && matrix.os == 'windows-x64' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}

      # Phase 999.66 (v1.7.4) — the former "Ensure windeployqt present" vcpkg
      # fail-fast/self-heal step was REMOVED here: Windows Qt now comes from the
      # prebuilt aqt kit, which ships its own self-contained windeployqt.exe at
      # $env:QT_ROOT_DIR\bin\windeployqt.exe. There is no host-triplet qttools to
      # install and no incomplete-install failure class to guard against.
      - name: Build (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # --config Release was REQUIRED on the original multi-config
          # generator (Visual Studio): without it, MSBuild defaulted to Debug
          # and tried to link Debug variants of vcpkg deps (e.g. tbb12_debug.lib),
          # which the x64-windows-release overlay triplet doesn't build.
          # See Phase 5.1 backlog Task D4 for the post-mortem on the v1.6.0
          # release workflow run 25908337693 that surfaced this. The flag is a
          # no-op under Ninja single-config (Phase 999.2-02) but kept for
          # explicit intent + future-proofing if anyone reverts the preset.
          #
          # 2026-05-16: dropped `--parallel $env:NUMBER_OF_PROCESSORS` so Ninja
          # uses its tuned default (`nproc + 2`) instead of capping at `nproc`.
          # See ci.yml's matching Build step for the full rationale. The flag's
          # cap was actively reducing concurrency vs Ninja's default.
          cmake --build --preset ci-windows --config Release --target BALL VIEW BALLView

      # Phase 999.50 (BUILD-ACCEL-07, plan item ②): save the warmed ccache AFTER the
      # build, gated `cache-hit != 'true'` (mirroring the vcpkg save gate).
      - name: Save ccache (Windows)
        if: always() && matrix.os == 'windows-x64' && steps.ccache-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ccache-${{ matrix.os }}-pch-v2-${{ github.sha }}

      # ----------------------------------------------------------------------
      # Phase 9 gatekeeper (BLOCKING — Phase 999.34, 2026-05-17) — Windows
      # parity with the macOS + Linux gatekeepers in this same file. Promoted
      # from BACKLOG in Phase 999.34; see ROADMAP.md and
      # .planning/phases/999.34-windows-test-gatekeeper/999.34-01-SUMMARY.md.
      # Mirrors the ci.yml Windows test gatekeeper (same step contents +
      # PATH/BALL_DATA_PATH setup; release-side JUnit filename + retention).
      # ----------------------------------------------------------------------
      # v1.7.x-09 (2026-05-19): gated on env var BALLVIEW_RELEASE_GATEKEEPER_TESTS.
      # See the macOS gatekeeper rationale comment above. CI on the same
      # commit already validates Windows tests in 22 min; release.yml's
      # duplicate adds 20+ min build + 5+ min run to the critical path.
      - name: Build BALL test suite (Windows — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'windows-x64' && env.BALLVIEW_RELEASE_GATEKEEPER_TESTS == '1'
        continue-on-error: false
        timeout-minutes: 45
        shell: pwsh
        run: |
          cmake --build build\ci-windows --target build_tests --config Release

      - name: Run BALL test suite (Windows — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'windows-x64' && env.BALLVIEW_RELEASE_GATEKEEPER_TESTS == '1'
        continue-on-error: false
        timeout-minutes: 60
        shell: pwsh
        run: |
          cd build\ci-windows
          # See ci.yml Windows gatekeeper for the BALL_DATA_PATH + PATH
          # discovery rationale.
          $env:BALL_DATA_PATH = "${{ github.workspace }}\data"
          # 999.66 — Windows Qt via aqtinstall: prepend $env:QT_ROOT_DIR\bin so
          # test EXEs load Qt6 DLLs from the aqt kit (no longer in vcpkg_installed).
          $env:PATH = "$PWD\bin;$env:QT_ROOT_DIR\bin;$PWD\vcpkg_installed\x64-windows-release\bin;$env:PATH"
          ctest --output-on-failure --timeout 120 `
                --output-junit "${{ github.workspace }}\ball-tests-windows-release.xml"

      - name: Upload test results (Windows — release)
        if: always() && matrix.os == 'windows-x64'
        uses: actions/upload-artifact@v6
        with:
          name: ball-tests-windows-release-${{ steps.resolve.outputs.ref }}-${{ github.run_id }}
          path: ball-tests-windows-release.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Locate BALLView.exe + windeployqt (Windows)
        if: matrix.os == 'windows-x64'
        id: locate-win
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\ci-windows -Filter BALLView.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::BALLView.exe not found in build/ci-windows"
            Get-ChildItem -Path build -Filter "*.exe" -Recurse | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "deploy_dir=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
          # 999.66 — Windows Qt via aqtinstall. windeployqt.exe now ships in the
          # prebuilt aqt kit at $env:QT_ROOT_DIR\bin\windeployqt.exe, and the kit
          # is self-contained (its own bin/plugins/translations) — so the old
          # x64-windows host-triplet DLL-staging dance (copying release-only Qt6
          # DLLs + translations + plugins into x64-windows/bin/ to satisfy the
          # vcpkg-built windeployqt) is GONE. Just point at the aqt windeployqt;
          # error fast if it's somehow absent.
          $wdq = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $wdq)) {
            Write-Host "::error::windeployqt.exe not found at $wdq (QT_ROOT_DIR=$env:QT_ROOT_DIR) — aqt Qt install incomplete. See ROADMAP Phase 999.66."
            if (Test-Path "$env:QT_ROOT_DIR\bin") {
              Get-ChildItem -Path "$env:QT_ROOT_DIR\bin" -Filter "windeployqt*" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            }
            exit 1
          }
          Write-Host "windeployqt (aqt kit): $wdq"
          "windeployqt=$wdq" >> $env:GITHUB_OUTPUT

      - name: windeployqt (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # 2026-05-16 Phase 5.1 carry-forward (release.yml Qt 6 alignment):
          # Qt 6's windeployqt DROPPED the `--no-angle` flag — ANGLE itself
          # was removed from Qt 6 (Qt 6 uses native OpenGL or QRhi, no longer
          # needs the OpenGL-ES → D3D translator). Passing `--no-angle` on
          # Qt 6 produces a hard `Unknown option 'no-angle'.` and exits 1.
          # Drop it. The Phase 5.1 macOS Qt 5 → Qt 6 sweep missed this Windows-
          # side counterpart — surfaced in release.yml run 25957687204 (the
          # second v1.6.1 release attempt).
          #
          # --no-opengl-sw: still valid on Qt 6 — skips opengl32sw.dll
          # (software-Mesa OpenGL fallback). BALL requires hardware OpenGL;
          # the software path isn't useful here and tends to surface
          # similar "DLL does not exist" failures depending on vcpkg port config.
          # See Phase 5.1 backlog D1/D6 for the broader Qt 6 deploy-tooling
          # surface (qttools port required, SW path skipped, etc.).
          & "${{ steps.locate-win.outputs.windeployqt }}" --release `
              --no-translations --no-system-d3d-compiler --no-compiler-runtime `
              --no-opengl-sw `
              "${{ steps.locate-win.outputs.exe }}"

      # =====================================================================
      # Phase 999.8-full: bundle WinSparkle.dll alongside BALLView.exe.
      # windeployqt only copies Qt DLLs — third-party DLLs like WinSparkle
      # are left where vcpkg installed them, so we copy explicitly.
      # vcpkg's x64-windows-release triplet drops the DLL under
      # build/ci-windows/vcpkg_installed/x64-windows-release/bin/WinSparkle.dll.
      # NSIS later picks it up from the deploy dir.
      # =====================================================================
      - name: Bundle WinSparkle.dll alongside BALLView.exe (Phase 999.8-full)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build\ci-windows\vcpkg_installed -Filter WinSparkle.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Host "::warning::WinSparkle.dll not found in vcpkg_installed — winsparkle vcpkg port may not have built. Auto-update DISABLED for this build."
            exit 0
          }
          Copy-Item -Path $dll.FullName -Destination "${{ steps.locate-win.outputs.deploy_dir }}" -Force
          Write-Host "Bundled WinSparkle.dll: $($dll.FullName) -> ${{ steps.locate-win.outputs.deploy_dir }}"

      - name: WinSparkle.dll smoke test (Phase 999.8-full)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $dll = Join-Path "${{ steps.locate-win.outputs.deploy_dir }}" "WinSparkle.dll"
          $exe = "${{ steps.locate-win.outputs.exe }}"
          if (-not (Test-Path $dll)) {
            Write-Host "::warning::WinSparkle.dll not bundled alongside BALLView.exe — auto-update disabled for this build."
            Write-Host "::warning::Expected at: $dll"
            exit 0
          }
          $exeDir = Split-Path $exe -Parent
          if ($exeDir -ne "${{ steps.locate-win.outputs.deploy_dir }}") {
            Write-Host "::warning::BALLView.exe is not in deploy_dir (Phase 8b layout assumption); copying WinSparkle.dll to BALLView.exe's directory as a fallback."
            Copy-Item -Path $dll -Destination $exeDir -Force
          }
          Write-Host "WinSparkle.dll smoke test PASSED."

      - name: Bundle data/ next to .exe (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $dataSrc = Join-Path $env:GITHUB_WORKSPACE "data"
          $dataDst = Join-Path "${{ steps.locate-win.outputs.deploy_dir }}" "data"
          if (Test-Path $dataSrc) {
            Copy-Item -Path $dataSrc -Destination $dataDst -Recurse -Force
            Write-Host "Bundled runtime data alongside BALLView.exe"
          } else {
            Write-Warning "data/ not found at repo root — bundle may be missing runtime resources"
          }

      - name: Zip deploy dir (Windows — portable .zip, kept alongside NSIS installer during v1.7 transition)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate-win.outputs.deploy_dir }}\*" -DestinationPath "${{ github.workspace }}\${{ steps.resolve.outputs.asset }}" -Force
          Get-Item "${{ github.workspace }}\${{ steps.resolve.outputs.asset }}" | Select-Object Length,Name

      # =====================================================================
      # Phase 8b: CPack NSIS installer (Windows)
      # Decisions 1+3+4 in .planning/phases/08-packaging-and-distribution/
      # 08-INSTALLER-FORMATS-RESEARCH.md: NSIS generator, per-user install
      # to %LOCALAPPDATA%\Programs (no UAC), English-only chrome.
      # =====================================================================
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # NSIS is preinstalled on windows-2025 runners (verify before install
          # to avoid chocolatey churn); install only if missing.
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Host "NSIS not on PATH; installing via Chocolatey..."
            choco install nsis -y --no-progress
          } else {
            Write-Host "NSIS already available: $($nsis.Source)"
          }

      - name: Build NSIS installer (Windows)
        if: matrix.os == 'windows-x64'
        id: nsis-build
        shell: pwsh
        run: |
          cd build/ci-windows
          # CPack -G NSIS reads CPACK_* vars from cmake/BALLPackageConfig.cmake.
          # Per-user install root (no admin); modernized for v1.7 (drop MSVC
          # 2010-2015 hardcoding; English-only chrome).
          cpack -G NSIS -C Release --verbose
          $installer = Get-ChildItem -Filter "BALLView-*-installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            # Fallback: CPack may emit a slightly different name if the
            # CPACK_PACKAGE_FILE_NAME suffix logic doesn't apply.
            $installer = Get-ChildItem -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "BALL*" -or $_.Name -like "*Setup*" } |
              Select-Object -First 1
          }
          if (-not $installer) {
            Write-Host "::error::NSIS installer .exe not produced by CPack"
            Get-ChildItem -Filter "*.exe" | Format-Table Name,Length
            exit 1
          }
          # Move the installer to the workspace root for predictable upload path.
          $installerName = "BALLView-${{ steps.resolve.outputs.ref }}-windows-x64-installer.exe"
          $installerDest = Join-Path $env:GITHUB_WORKSPACE $installerName
          Move-Item -Path $installer.FullName -Destination $installerDest -Force
          Write-Host "Installer produced: $installerName ($((Get-Item $installerDest).Length) bytes)"
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_path=$installerDest" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # v1.7.0-rc1 NSIS post-mortem (2026-05-18): when `cpack -G NSIS` fails,
      # the actual makensis.exe output is written to
      # build/ci-windows/_CPack_Packages/win64/NSIS/NSISOutput.log
      # which CPack itself names in the error message but does not upload.
      # Without that log, the next iteration is blind. Upload it as a
      # workflow artifact on failure so we can read it directly.
      # ---------------------------------------------------------------------
      - name: Upload NSIS diagnostic logs on failure (Windows)
        if: failure() && matrix.os == 'windows-x64'
        uses: actions/upload-artifact@v6
        with:
          name: nsis-failure-logs-${{ steps.resolve.outputs.ref }}-${{ github.run_id }}
          path: |
            build/ci-windows/_CPack_Packages/**/NSIS/NSISOutput.log
            build/ci-windows/_CPack_Packages/**/NSIS/project.nsi
            build/ci-windows/CPackConfig.cmake
            build/ci-windows/CPackSourceConfig.cmake
          if-no-files-found: warn
          retention-days: 14

      - name: Compute SHA256 for Windows installer (always-on integrity check)
        if: matrix.os == 'windows-x64'
        id: installer-sha
        shell: pwsh
        run: |
          # SHA256 published in release body so users can verify the unsigned
          # installer matches what GitHub Actions built — independent integrity
          # anchor when Authenticode signing isn't available yet. See
          # packaging/windows/README-SMARTSCREEN.md for the user-facing flow.
          $hash = (Get-FileHash "${{ steps.nsis-build.outputs.installer_path }}" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          # Also write a sidecar file so the release job can read it later.
          "$hash  ${{ steps.nsis-build.outputs.installer_name }}" | Out-File -FilePath "${{ steps.nsis-build.outputs.installer_path }}.sha256" -Encoding ascii -NoNewline

      # =====================================================================
      # Upload workflow artifacts.
      #
      # Order (Windows only — Phase 8b):
      #   1. Upload portable .zip (macOS + Linux + Windows) — unconditional.
      #   2. Upload unsigned installer .exe — captures the artifact-id used
      #      by SignPath (the SignPath action takes a github-artifact-id
      #      input pointing at an already-uploaded artifact).
      #   3. SignPath step (gated) — submits the artifact-id to SignPath,
      #      blocks on UI approval, downloads signed .exe.
      #   4. Re-upload signed installer (gated) — same artifact name +
      #      `overwrite: true` so downstream `download-artifact` sees the
      #      signed version. Also re-emits the SHA256 sidecar.
      # When the SignPath secret is absent, steps 3+4 skip and the unsigned
      # installer uploaded at step 2 is what the release job picks up.
      # =====================================================================
      - name: Upload workflow artifact (portable .zip, macOS + Linux + Windows)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.resolve.outputs.asset }}
          path: ${{ steps.resolve.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload workflow artifact (Windows NSIS installer .exe — unsigned)
        if: matrix.os == 'windows-x64'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.nsis-build.outputs.installer_name }}
          path: |
            ${{ steps.nsis-build.outputs.installer_path }}
            ${{ steps.nsis-build.outputs.installer_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Phase 999.68 (WINSIGN-01) — Windows installer signing via SignPath
      # Foundation GitHub Action. GATED on the SIGNPATH_API_TOKEN secret.
      #
      # CURRENT STATE: SignPath Foundation (OSS program) enrollment is PENDING
      # — the maintainer has not yet enrolled the project and the
      # SIGNPATH_API_TOKEN secret is ABSENT. Until then this is a no-op SCAFFOLD:
      #   - When the secret is ABSENT  → the "SignPath not configured" step
      #     below emits a clear ::warning:: and the release ships the UNSIGNED
      #     NSIS installer (uploaded at the step above). The release path is
      #     NOT broken and does NOT fail.
      #   - When the secret is PRESENT → the sign step submits the unsigned
      #     installer to SignPath, waits for an admin to click "approve" in the
      #     SignPath UI (intentional anti-supply-chain control), downloads the
      #     signed .exe, and re-uploads it over the unsigned artifact.
      #
      # NOTE: the `secrets` context is NOT available in `if:` conditions — using
      # `secrets.X != ''` directly in an `if:` makes the WHOLE workflow invalid
      # (GitHub emits a 0-job startup_failure on every push/tag). So we map the
      # secret into a step `env:` (which IS legal), emit a boolean step output,
      # and gate every downstream step on `steps.signpath-gate.outputs.enabled`.
      #
      # Maintainer setup (apply to SignPath, create project/policy, generate
      # token, add the repo secrets) is documented step-by-step in:
      #   .planning/phases/999.68-packaging-signing-license/SIGNPATH-SECRETS-RUNBOOK.md
      # ---------------------------------------------------------------------
      - name: Determine SignPath availability (Windows)
        id: signpath-gate
        if: matrix.os == 'windows-x64'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }

      - name: SignPath not configured — ship unsigned (Windows — warn + skip)
        if: matrix.os == 'windows-x64' && steps.signpath-gate.outputs.enabled == 'false'
        shell: pwsh
        run: |
          Write-Host "::warning title=Windows installer is UNSIGNED::SIGNPATH_API_TOKEN is not set — SignPath Foundation enrollment is still pending (WINSIGN-01). Shipping the UNSIGNED NSIS installer; Windows SmartScreen will warn users on first run. To enable signing, follow .planning/phases/999.68-packaging-signing-license/SIGNPATH-SECRETS-RUNBOOK.md and add the SIGNPATH_API_TOKEN + SIGNPATH_ORG_ID repo secrets."

      - name: Sign installer via SignPath Foundation (Windows — gated on secret)
        if: matrix.os == 'windows-x64' && steps.signpath-gate.outputs.enabled == 'true'
        id: signpath-sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: 'ballview'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'installer'
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed-installer'

      - name: Recompute SHA256 + re-upload signed installer (Windows — gated)
        if: matrix.os == 'windows-x64' && steps.signpath-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "signed-installer" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signed) {
            Move-Item -Path $signed.FullName -Destination "${{ steps.nsis-build.outputs.installer_path }}" -Force
            Write-Host "Signed installer replaces unsigned: $($signed.Name) → ${{ steps.nsis-build.outputs.installer_name }}"
            # Recompute SHA256 — the signed binary has a different hash than
            # the unsigned one because Authenticode embeds the signature
            # block into the .exe.
            $hash = (Get-FileHash "${{ steps.nsis-build.outputs.installer_path }}" -Algorithm SHA256).Hash.ToLower()
            "$hash  ${{ steps.nsis-build.outputs.installer_name }}" | Out-File -FilePath "${{ steps.nsis-build.outputs.installer_path }}.sha256" -Encoding ascii -NoNewline
            Write-Host "SHA256 (signed): $hash"
          } else {
            Write-Host "::warning::SignPath step ran but no signed artifact found under signed-installer/"
          }

      - name: Re-upload signed installer artifact (Windows — gated)
        if: matrix.os == 'windows-x64' && steps.signpath-gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.nsis-build.outputs.installer_name }}
          path: |
            ${{ steps.nsis-build.outputs.installer_path }}
            ${{ steps.nsis-build.outputs.installer_path }}.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    name: Create GitHub Release
    needs: package
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve ref
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Download all packaging artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec ls -lh {} \;

      - name: Extract Windows installer SHA256 (Phase 8b — emit into release body)
        id: win-sha
        shell: bash
        run: |
          # Phase 8b: every release publishes the Windows installer SHA256 in
          # the release body so end users can verify the unsigned binary
          # matches what GitHub Actions built. See
          # packaging/windows/README-SMARTSCREEN.md for the user-facing flow.
          # If the .sha256 sidecar is missing (e.g., upstream NSIS step
          # failed), emit the placeholder string — release-body emission
          # still works; users see a clear "see artifact list" hint.
          SHA_FILE=$(find artifacts -type f -name "*.sha256" -path "*windows-x64*" 2>/dev/null | head -1)
          if [ -n "$SHA_FILE" ] && [ -f "$SHA_FILE" ]; then
            SHA256=$(awk '{print $1}' "$SHA_FILE")
            echo "win_sha256=$SHA256" >> "$GITHUB_OUTPUT"
            echo "Windows installer SHA256: $SHA256"
          else
            echo "win_sha256=see artifact list (sha256 sidecar missing)" >> "$GITHUB_OUTPUT"
            echo "::warning::No .sha256 sidecar found under artifacts/ for Windows installer"
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_SHA256: ${{ steps.win-sha.outputs.win_sha256 }}
        shell: bash
        run: |
          REF="${{ steps.resolve.outputs.ref }}"
          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.draft || 'true' }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          # Phase 8b: release body now references the SmartScreen README +
          # publishes the installer SHA256 for integrity verification.
          # Heredoc uses unquoted EOF so $WIN_SHA256 + $REF expand.
          BODY=$(cat <<EOF
          Installers built from this tag.

          - **macOS:** download the \`.dmg\`, double-click to mount, drag \`BALLView.app\` to \`/Applications\`. Signed + notarized (Phase 8a) — no Gatekeeper prompt expected on macOS 14+ / macOS 26+. If the cert is still pending procurement, the \`.dmg\` ships unsigned: right-click → Open → confirm on first launch, or run \`xattr -dr com.apple.quarantine /Applications/BALLView.app\` once.
          - **Windows:** download the \`.exe\` installer (NSIS, per-user install to \`%LOCALAPPDATA%\\Programs\\BALLView\` — no admin/UAC required). Windows SmartScreen will warn on first run until the SignPath Foundation OSS signing cert lands (Phase 8b). Click **More info → Run anyway** to proceed. See [packaging/windows/README-SMARTSCREEN.md](https://github.com/BALL-Project/ball/blob/${REF}/packaging/windows/README-SMARTSCREEN.md) for the full guide + integrity verification flow.
            **Windows installer SHA256:** \`${WIN_SHA256}\`
            A portable \`.zip\` (extract-and-run, no installer) is also available for users who don't want a Start Menu entry.

          Build from source: see \`BUILD-macos.md\` (macOS), the GitHub Actions CI workflow at the same tag for the Linux + Windows recipes.

          - **Linux:** four artifacts per arch (x86_64 + arm64): \`.AppImage\` (portable, double-click to run — bundles Qt 6.8 + plugins via linuxdeploy; remember \`chmod +x\` then \`./BALLView-*.AppImage\`), \`.deb\` (Debian / Ubuntu 24.04+; \`sudo apt install ./BALLView-*.deb\`), \`.rpm\` (Fedora 40+ / RHEL / openSUSE; \`sudo dnf install ./BALLView-*.rpm\`), and a portable \`.tar.gz\` (extract-and-run, requires system Qt 6.8+). All Linux SKUs are LGPL — FFTW is intentionally absent (no GPL relicensing). See \`BUILD-linux.md\` for build-from-source instructions and \`.planning/phases/08c-packaging-linux/08c-FFTW-GPL-DECISION.md\` for the GPL rationale.
          EOF
          )

          # If the release doesn't exist yet, create it. Otherwise update assets.
          # Collect .zip (portable / macOS legacy), .dmg (macOS Phase 8a), and
          # .exe (Windows installer Phase 8b) into a single shell glob —
          # Bash's nullglob handles the empty case if one platform's artifact
          # is missing.
          shopt -s nullglob
          # Phase 8c part-2: Linux ships .tar.gz (portable) + .deb + .rpm + .AppImage
          # alongside the macOS .dmg + Windows .exe/.zip. All globs feed one
          # gh release upload pass.
          ASSETS=( artifacts/*/*.zip artifacts/*/*.dmg artifacts/*/*.exe artifacts/*/*.tar.gz artifacts/*/*.deb artifacts/*/*.rpm artifacts/*/*.AppImage )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No artifacts found to upload (expected .zip, .dmg, .exe, .tar.gz, .deb, .rpm, and/or .AppImage under artifacts/)"
            exit 1
          fi

          if gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $REF exists — uploading assets (clobber)"
            for f in "${ASSETS[@]}"; do
              gh release upload "$REF" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            done
          else
            echo "Creating release $REF $DRAFT_FLAG"
            gh release create "$REF" $DRAFT_FLAG \
              --title "BALLView $REF" \
              --notes "$BODY" \
              --repo "$GITHUB_REPOSITORY" \
              "${ASSETS[@]}"
          fi

  # =========================================================================
  # Phase 999.8-full: publish appcast XML to gh-pages.
  # Runs AFTER `release` so the .dmg + .exe are already attached to the GH
  # Release (URLs in the appcast entries point at those assets).
  # Gated on AUTOUPDATE_ED25519_PRIVATE_KEY being set — without it, signing
  # is impossible and Sparkle/WinSparkle would reject the appcast entry on
  # the client. Maintainers running pre-key smoke releases skip this job
  # entirely (Sparkle/WinSparkle just don't find a new entry — graceful
  # degradation, no error in the installed app).
  # See .planning/phases/999.8-auto-update-sparkle-winsparkle/APPCAST-PUBLISHING-RUNBOOK.md.
  # =========================================================================
  publish-appcast:
    name: Publish appcast (Phase 999.8-full)
    needs: release
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve ref
        id: resolve
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          # Strip leading 'v' to get the sparkle:version attribute value.
          VERSION="${REF#v}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubdate=$(date -u +'%a, %d %b %Y %H:%M:%S +0000')" >> "$GITHUB_OUTPUT"

      - name: Ed25519 private key presence check
        shell: bash
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [ -z "$AUTOUPDATE_ED25519_PRIVATE_KEY" ]; then
            echo "::warning::AUTOUPDATE_ED25519_PRIVATE_KEY secret unset — skipping appcast publish."
            echo "::warning::Installed BALLView clients will not see this release as an update."
            echo "::warning::See .planning/phases/999.8-auto-update-sparkle-winsparkle/ED25519-KEY-RUNBOOK.md."
            exit 0
          fi
          echo "Ed25519 private key present — proceeding with appcast publish."

      - name: Checkout gh-pages branch
        if: ${{ env.AUTOUPDATE_ED25519_PRIVATE_KEY != '' }}
        uses: actions/checkout@v5
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
        with:
          ref: gh-pages
          path: gh-pages-checkout
          fetch-depth: 1

      - name: Fetch release asset metadata
        if: ${{ env.AUTOUPDATE_ED25519_PRIVATE_KEY != '' }}
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ steps.resolve.outputs.ref }}" \
            --repo "${{ github.repository }}" \
            --json assets > /tmp/release-assets.json
          cat /tmp/release-assets.json | jq '.assets[] | {name, size, url: .url}'

      - name: Download .dmg + .exe assets for signing
        if: ${{ env.AUTOUPDATE_ED25519_PRIVATE_KEY != '' }}
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/release-bin
          cd /tmp/release-bin
          gh release download "${{ steps.resolve.outputs.ref }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" --pattern "*installer.exe" || true
          ls -lh /tmp/release-bin/

      - name: Sign assets + update appcast XMLs
        if: ${{ env.AUTOUPDATE_ED25519_PRIVATE_KEY != '' }}
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
          APPCAST_REF: ${{ steps.resolve.outputs.ref }}
          APPCAST_VERSION: ${{ steps.resolve.outputs.version }}
          APPCAST_PUBDATE: ${{ steps.resolve.outputs.pubdate }}
          APPCAST_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$AUTOUPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          MACOS_DMG=$(ls /tmp/release-bin/*macos-arm64*.dmg 2>/dev/null | head -1 || true)
          WIN_EXE=$(ls /tmp/release-bin/*windows-x64*installer.exe 2>/dev/null | head -1 || true)
          export APPCAST_MACOS_DMG="$MACOS_DMG"
          export APPCAST_WIN_EXE="$WIN_EXE"
          export APPCAST_KEY_FILE="$KEY_FILE"
          python3 scripts/publish_appcast.py

      - name: Commit + push gh-pages
        if: ${{ env.AUTOUPDATE_ED25519_PRIVATE_KEY != '' }}
        env:
          AUTOUPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AUTOUPDATE_ED25519_PRIVATE_KEY }}
        working-directory: gh-pages-checkout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast-macos.xml appcast-windows.xml || true
          if git diff --cached --quiet; then
            echo "No appcast changes to commit (no .dmg/.exe assets matched?)"
            exit 0
          fi
          git commit -m "appcast: ${{ steps.resolve.outputs.ref }}"
          git push origin gh-pages
