name: Release

# Binary installer build for tagged releases. Trigger manually with
# `gh workflow run release.yml -f tag=v1.7.0` (or via the Actions UI).
# Future tags pushed in the v*.*.* shape will also auto-trigger.
#
# Scope: macOS arm64 + Windows x64 binary bundles, attached to a GitHub
# Release. Linux installers are Phase 8c.
#
# Signing status:
# - macOS (Phase 8a): Developer ID Application + notarytool + stapled .dmg
#   when MACOS_CERTIFICATE_BASE64 secret is set; falls back to ad-hoc
#   resigned .dmg + Gatekeeper warning otherwise. See
#   .planning/phases/08a-packaging-macos/08a-SECRETS-RUNBOOK.md.
# - Windows (Phase 8b): SignPath — still pending.
# - Linux (Phase 8c): AppImage / .deb / .rpm — still pending.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and package (e.g. v1.6.0)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as draft"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-05-16: macOS reverted to macos-14 (Sonoma) to match OpenMS
          # parity (see ci.yml's matching comment). Windows stays on
          # windows-2025 (newer MSVC + SDK; OpenMS uses this too). The
          # macOS bundle's runtime target is macOS 26 (Tahoe) via the
          # D4-mac ad-hoc resign — exercised at user install time, not at
          # CI build time, so Sonoma CI is sufficient.
          - os: macos-arm64
            runner: macos-14
          - os: windows-x64
            runner: windows-2025

    steps:
      - name: Resolve target ref
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # macOS now ships a .dmg (Phase 8a, PKG-MAC-03); Windows + others
          # remain .zip until their respective Phase 8 slices land.
          case "${{ matrix.os }}" in
            macos-*) ASSET_EXT="dmg" ;;
            *)       ASSET_EXT="zip" ;;
          esac
          echo "asset=BALLView-${REF}-${{ matrix.os }}.${ASSET_EXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: $REF (asset extension: ${ASSET_EXT})"

      - name: Checkout (at resolved tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      # =====================================================================
      # macOS arm64 — Homebrew Qt 6, ci-macos preset, macdeployqt
      #
      # Phase 5.1 critical fix (codex review CRITICAL #1, 2026-05-15):
      # v1.6.0 tagged on a Qt 5 codebase (release ran `brew install qt@5`
      # against `FIND_PACKAGE(Qt5 ...)` in CMakeLists.txt and the qt@5 path
      # to macdeployqt). Phase 5 migrated the codebase to Qt 6 but this
      # workflow was never updated. Any v1.6.1 release attempt would have
      # failed at CMake configure because the codebase now requires Qt 6
      # (FIND_PACKAGE(Qt6 ... REQUIRED ...) at CMakeLists.txt:319). Mirror
      # ci.yml's Qt 6 Homebrew setup: `brew install qt` (unversioned name
      # is Qt 6 on current Homebrew) and `qt/bin/macdeployqt`.
      # =====================================================================
      - name: Install dependencies (macOS / Homebrew)
        if: matrix.os == 'macos-arm64'
        run: |
          # Phase 8a (PKG-MAC-03): + create-dmg for the signed .dmg artifact.
          brew install qt boost eigen fftw tbb glew open-babel lp_solve libsvm flex bison ccache create-dmg

      - name: Configure (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          cmake --preset ci-macos -DBALL_LICENSE=GPL

      - name: Build (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          cmake --build --preset ci-macos --target BALL VIEW BALLView -j$(sysctl -n hw.ncpu)

      # ----------------------------------------------------------------------
      # Phase 9 gatekeeper (BLOCKING — TEST-CLOSE-02) — mirrors the ci.yml
      # gatekeeper so release builds ALSO surface unit test regressions.
      # Tests run AFTER the BALLView build (the binary the user gets in the
      # installer must build green; tests give us confidence in correctness
      # of the binary that ships).
      # Three baseline failures triaged in 09-TRIAGE.md (Phase 9, 2026-05-16).
      # Windows test gatekeeper deferred to Phase 999.34.
      # ----------------------------------------------------------------------
      # TEST-CLOSE-02 (Phase 9, 2026-05-16): gatekeeper flipped to blocking
      # after 3 baseline failures triaged in 09-TRIAGE.md.
      - name: Build BALL test suite (macOS — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'macos-arm64'
        continue-on-error: false
        timeout-minutes: 45
        run: |
          cmake --build build/ci-macos --target build_tests -j$(sysctl -n hw.ncpu)

      # TEST-CLOSE-02 (Phase 9, 2026-05-16): gatekeeper flipped to blocking
      # after 3 baseline failures triaged in 09-TRIAGE.md.
      - name: Run BALL test suite (macOS — Phase 9 gatekeeper, blocking)
        if: matrix.os == 'macos-arm64'
        continue-on-error: false
        timeout-minutes: 60
        run: |
          cd build/ci-macos
          # BALL_DATA_PATH MUST be set — see ci.yml gatekeeper for the
          # post-mortem (v1.6.0 local baseline: 50/294 fail without it,
          # 3/294 fail with it).
          export BALL_DATA_PATH="${{ github.workspace }}/data"
          # TEST-CLOSE-02: || true removed — this step is now blocking.
          ctest --output-on-failure --timeout 120 \
                --output-junit ${{ github.workspace }}/ball-tests-macos-release.xml

      - name: Upload test results (macOS — release)
        if: always() && matrix.os == 'macos-arm64'
        uses: actions/upload-artifact@v6
        with:
          name: ball-tests-macos-release-${{ steps.resolve.outputs.ref }}-${{ github.run_id }}
          path: ball-tests-macos-release.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Locate BALLView.app (macOS)
        if: matrix.os == 'macos-arm64'
        id: locate-mac
        shell: bash
        run: |
          APP=$(find build/ci-macos -name "BALLView.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::BALLView.app not found in build/ci-macos"
            find build/ci-macos -name "BALLView*" -maxdepth 8 2>/dev/null || true
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      # ----------------------------------------------------------------------
      # Phase 8a — macOS code signing + notarization + .dmg packaging.
      # See .planning/phases/08a-packaging-macos/08a-01-PLAN.md and
      # .planning/phases/08a-packaging-macos/08a-SECRETS-RUNBOOK.md.
      #
      # The signing path is gated on MACOS_CERTIFICATE_BASE64 being set —
      # the fallback (no cert / pre-procurement) path skips signing and
      # ships an unsigned-with-warning .dmg, matching v1.6 user UX while
      # the cert is in flight. Once secrets land, every step below runs;
      # the gate becomes a no-op.
      # ----------------------------------------------------------------------
      - name: Detect macOS signing readiness
        if: matrix.os == 'macos-arm64'
        id: mac-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing ENABLED — Developer ID cert + notarization path"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE_BASE64 not set — building UNSIGNED .dmg (ad-hoc resign fallback). See 08a-SECRETS-RUNBOOK.md."
          fi

      - name: Import Apple Developer ID cert into CI keychain (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Create an ephemeral keychain so we never touch the runner's
          # default login keychain (security best practice for CI).
          KEYCHAIN_PATH="${RUNNER_TEMP}/ball-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # Allow codesign to access the private key without password prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Make our keychain the default search target for the duration
          # of the job.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Sanity check — the signing identity must now be visible.
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

          # Wipe the .p12 from disk; the keychain copy is all we need.
          rm -P "$CERT_PATH" 2>/dev/null || rm -f "$CERT_PATH"

      - name: macdeployqt (macOS)
        if: matrix.os == 'macos-arm64'
        run: |
          # Phase 5.1 carry-forward: qt (unversioned) is Qt 6 on current Homebrew.
          # NOTE: we do NOT pass `-codesign=` here — macdeployqt's per-binary
          # signing happens too early in the pipeline (before data/ is bundled
          # and entitlements are applied). Phase 8a's `Codesign BALLView.app`
          # step below performs the seal-the-whole-bundle signing with
          # --deep + entitlements + hardened runtime.
          /opt/homebrew/opt/qt/bin/macdeployqt "${{ steps.locate-mac.outputs.app }}" -verbose=1

      - name: Bundle data/ into the .app (macOS)
        if: matrix.os == 'macos-arm64'
        shell: bash
        run: |
          if [ -d data ]; then
            mkdir -p "${{ steps.locate-mac.outputs.app }}/Contents/Resources/data"
            cp -R data/* "${{ steps.locate-mac.outputs.app }}/Contents/Resources/data/"
            echo "Bundled $(du -sh data | awk '{print $1}') of runtime data into the .app"
          else
            echo "::warning::data/ not found at repo root — .app may be missing runtime resources"
          fi

      - name: Codesign BALLView.app with Developer ID + hardened runtime (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # MUST run AFTER macdeployqt + data/ bundling — both modify the
          # bundle contents and would invalidate any earlier signature seal.
          # Phase 8a (PKG-MAC-01) — replaces the v1.6 ad-hoc resign step.
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements packaging/macos/BALLView.entitlements \
            --timestamp \
            "${{ steps.locate-mac.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 \
            "${{ steps.locate-mac.outputs.app }}" 2>&1 | tail -20

      - name: Ad-hoc resign bundle (macOS — UNSIGNED fallback path only)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'false'
        run: |
          # Fallback path: Apple Developer cert not yet procured. Use the
          # v1.6 ad-hoc resign to satisfy macOS 26's CODESIGNING enforcement
          # at the bundle level (no Developer ID, no notarization — users
          # get a Gatekeeper warning + `xattr -dr com.apple.quarantine`
          # workaround). REMOVE this step once MACOS_CERTIFICATE_BASE64 is
          # set; the signed path above replaces it.
          codesign --force --deep --sign - "${{ steps.locate-mac.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate-mac.outputs.app }}" 2>&1 | tail -10

      - name: Zip .app for notary submission (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        run: |
          # notarytool requires .zip/.dmg/.pkg input. We zip the .app
          # separately here (not the final .dmg) because the .dmg gets
          # created *after* the .app's notarization ticket is stapled —
          # otherwise stapler would have to staple the .dmg's enclosed
          # .app post-mount, which create-dmg does not support.
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.locate-mac.outputs.app }}" \
            "${{ runner.temp }}/BALLView-notarize.zip"

      - name: Submit to Apple notary + wait (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        timeout-minutes: 60
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          # Steady-state: 5-15 min. First-ever submission for a fresh
          # bundle ID can take 8-12h — that priming submission must be
          # done MANUALLY (see 08a-SECRETS-RUNBOOK.md Section 5) before
          # the first tagged release.
          xcrun notarytool submit \
            "${{ runner.temp }}/BALLView-notarize.zip" \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait

      - name: Staple notarization ticket + spctl assess fail-fast (macOS)
        if: matrix.os == 'macos-arm64' && steps.mac-signing.outputs.enabled == 'true'
        run: |
          xcrun stapler staple "${{ steps.locate-mac.outputs.app }}"
          xcrun stapler validate "${{ steps.locate-mac.outputs.app }}"
          # Fail-fast at CI time, not user-install time, if Gatekeeper
          # would reject the bundle. The grep MUST find the magic string.
          spctl --assess --type execute --verbose=4 \
            "${{ steps.locate-mac.outputs.app }}" 2>&1 | tee /tmp/spctl-assess.log
          grep -q 'source=Notarized Developer ID' /tmp/spctl-assess.log

      - name: Build signed .dmg via create-dmg (macOS)
        if: matrix.os == 'macos-arm64'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # create-dmg --codesign signs the .dmg outer wrapper with the
          # Developer ID identity. The enclosed .app is already signed +
          # stapled from prior steps. If signing is disabled (fallback
          # path), --codesign is omitted and the .dmg ships unsigned.
          APP="${{ steps.locate-mac.outputs.app }}"
          APP_DIR=$(dirname "$APP")
          # create-dmg refuses to overwrite — clean any stale output.
          DMG="${{ github.workspace }}/${{ steps.resolve.outputs.asset }}"
          rm -f "$DMG"

          CODESIGN_FLAG=()
          if [ "${{ steps.mac-signing.outputs.enabled }}" = "true" ]; then
            CODESIGN_FLAG=(--codesign "$MACOS_SIGNING_IDENTITY")
          fi

          # Stage the .app alone in a clean source dir so create-dmg only
          # includes BALLView.app (not stray build artifacts in APP_DIR).
          STAGE="${RUNNER_TEMP}/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"

          create-dmg \
            --volname "BALLView ${{ steps.resolve.outputs.ref }}" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 --icon "BALLView.app" 175 190 \
            --hide-extension "BALLView.app" \
            --app-drop-link 425 190 \
            "${CODESIGN_FLAG[@]}" \
            "$DMG" "$STAGE"
          ls -lh "$DMG"

      # =====================================================================
      # Windows x64 — vcpkg manifest, ci-windows preset, windeployqt
      # =====================================================================

      # Phase 999.28 follow-up — cross-ref vcpkg cache seed for the release
      # pipeline. release.yml runs on TAG-push refs whose actions/cache
      # scope is disjoint from any branch's scope, so CI's warm vcpkg
      # cache on v1.6-modernization is invisible here. Workaround: CI
      # uploads %LOCALAPPDATA%\vcpkg\archives as a workflow ARTIFACT
      # (cross-ref accessible via gh API). This step downloads the most
      # recent successful vcpkg-archives-windows artifact from the CI
      # workflow and stages it under %LOCALAPPDATA%\vcpkg\archives BEFORE
      # the actions/cache restore step. vcpkg then hits the seeded local
      # archives during cmake configure and skips the ~2h from-source
      # Qt6+Boost compile that has OOM'd this pipeline 4× on v1.6.2.
      #
      # Fail-soft: if no artifact exists (first run after this change,
      # or beyond the 14-day retention window), continue without seeding
      # and fall back to cold vcpkg.
      - name: Seed vcpkg archives from CI artifact (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stageDir = "C:\Users\runneradmin\AppData\Local\vcpkg\archives"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Write-Host "Looking for latest successful CI run on v1.6-modernization with vcpkg-archives-windows artifact..."

          # Find the most recent successful CI workflow run on the branch
          # that has the vcpkg-archives-windows artifact still within
          # retention.
          $runs = gh run list --workflow=CI --branch=v1.6-modernization --status=success --limit=20 --json databaseId | ConvertFrom-Json

          $found = $false
          foreach ($r in $runs) {
            $rid = $r.databaseId
            $artifacts = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$rid/artifacts" --jq '.artifacts[] | select(.name == "vcpkg-archives-windows" and .expired == false) | .id' 2>$null
            if ($artifacts) {
              Write-Host "Found vcpkg-archives-windows artifact in CI run $rid"
              gh run download $rid --repo $env:GITHUB_REPOSITORY --name vcpkg-archives-windows --dir $stageDir
              if ($LASTEXITCODE -eq 0) {
                $count = (Get-ChildItem -Path $stageDir -Recurse -File | Measure-Object).Count
                Write-Host "Staged $count vcpkg archive files under $stageDir"
                $found = $true
                break
              } else {
                Write-Host "Download failed for run $rid (exit $LASTEXITCODE); trying older run..."
              }
            }
          }
          if (-not $found) {
            Write-Host "::warning::No vcpkg-archives-windows artifact found within retention; will cold-build vcpkg"
          }

      - name: Restore vcpkg binary cache (Windows)
        id: vcpkg-cache
        if: matrix.os == 'windows-x64'
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      # Windows tooling install: flex/bison + ccache via a single composite
      # action. See .github/actions/setup-windows-deps/action.yml — that is
      # the canonical place to add future Windows-only tools.
      - name: Set up Windows build deps (flex/bison + ccache + ninja)
        if: matrix.os == 'windows-x64'
        uses: ./.github/actions/setup-windows-deps

      # Phase 999.2: with Ninja replacing MSBuild, cl.exe is invoked directly
      # and needs the vcvars64.bat environment (PATH, INCLUDE, LIB, LIBPATH).
      # MSBuild had this implicit via VS project files; Ninja does not.
      # Without this step, CMake falls back to whatever C++ compiler is on
      # PATH (often MinGW gcc on GitHub Windows runners), which fails on
      # Windows headers (`LARGE_INTEGER not declared`, etc.) — exactly what
      # blocked release run 25955116618. ilammy/msvc-dev-cmd@v1 is the
      # canonical GitHub Actions wrapper around vcvarsall.bat x64. Mirrors
      # the ci.yml setup added in Phase 999.2-03.
      - name: Set up MSVC environment (Windows — vcvars64 for Ninja)
        if: matrix.os == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Free disk space before vcpkg (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # v1.6.2 release-pipeline learning: starting free disk on windows-2025
          # is ~32 GB (NOT ~14 GB as docs suggested), but cold vcpkg Qt6 + Boost
          # easily consumes 30+ GB of buildtrees and OOM-kills the runner's
          # diag-log writer. Previous cleanup (Android SDK, JDK) only gained
          # 1.2 GB because those paths don't exist on windows-2025.
          # This iteration removes the actual large bloat: hosted toolcache
          # languages we don't use (Python <3.12, Ruby, PyPy, Java JDK, Go),
          # browser installs (Chrome, Firefox), pre-installed DB servers,
          # Strawberry Perl. Verified-present paths only; absent paths
          # SilentlyContinue (no failure).
          $before = (Get-PSDrive C).Free / 1GB
          Write-Host ("Free space before cleanup: {0:N1} GB" -f $before)

          $targets = @(
            # Hosted toolcache languages (each typically 1-3 GB)
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\hostedtoolcache\windows\Java_Adopt_jdk",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            # Old Python versions (keep 3.12+ in case vcpkg or cmake helper needs)
            "C:\hostedtoolcache\windows\Python\3.7.*",
            "C:\hostedtoolcache\windows\Python\3.8.*",
            "C:\hostedtoolcache\windows\Python\3.9.*",
            "C:\hostedtoolcache\windows\Python\3.10.*",
            "C:\hostedtoolcache\windows\Python\3.11.*",
            # Browser installs (cmake build doesn't use them)
            "C:\Program Files\Google\Chrome",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files (x86)\Google",
            "C:\Program Files (x86)\Mozilla Firefox",
            # Pre-installed DB servers (BALL build doesn't use them)
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\Microsoft SQL Server",
            # Strawberry Perl (cmake's Perl finder picks chocolatey or Git Bash perl first)
            "C:\Strawberry",
            # JDK variants outside hostedtoolcache
            "C:\Program Files\Java",
            "C:\Program Files\Eclipse Adoptium",
            "C:\Program Files\Microsoft\jdk*",
            # Old VS variants if present (keep 2022, primary)
            "C:\Program Files (x86)\Microsoft Visual Studio\2019"
          )

          foreach ($t in $targets) {
            if (Test-Path $t) {
              try {
                Remove-Item -Recurse -Force $t -ErrorAction Stop
                Write-Host ("  removed: {0}" -f $t)
              } catch {
                Write-Host ("  skip (in use): {0}" -f $t)
              }
            }
          }

          $after = (Get-PSDrive C).Free / 1GB
          Write-Host ("Free space after cleanup:  {0:N1} GB (gained {1:N1} GB)" -f $after, ($after - $before))

      - name: Configure (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          # Pass --clean-after-build via CMake cache variable, NOT env var.
          # vcpkg's manifest-mode cmake integration honors the CMake
          # VCPKG_INSTALL_OPTIONS variable; the env-var spelling is for
          # the standalone `vcpkg install` CLI and was silently ignored in
          # the v1.6.2 attempt-2 release (cold-vcpkg OOM'd despite the
          # env setting). The list-form ";" separator is required so cmake
          # treats it as a list value.
          cmake --preset ci-windows `
            -DBISON_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_bison.exe" `
            -DFLEX_EXECUTABLE="C:/ProgramData/chocolatey/bin/win_flex.exe" `
            "-DVCPKG_INSTALL_OPTIONS=--clean-after-build"

      - name: Save vcpkg binary cache (Windows)
        if: always() && matrix.os == 'windows-x64' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-release.cmake') }}

      - name: Build (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # --config Release was REQUIRED on the original multi-config
          # generator (Visual Studio): without it, MSBuild defaulted to Debug
          # and tried to link Debug variants of vcpkg deps (e.g. tbb12_debug.lib),
          # which the x64-windows-release overlay triplet doesn't build.
          # See Phase 5.1 backlog Task D4 for the post-mortem on the v1.6.0
          # release workflow run 25908337693 that surfaced this. The flag is a
          # no-op under Ninja single-config (Phase 999.2-02) but kept for
          # explicit intent + future-proofing if anyone reverts the preset.
          #
          # 2026-05-16: dropped `--parallel $env:NUMBER_OF_PROCESSORS` so Ninja
          # uses its tuned default (`nproc + 2`) instead of capping at `nproc`.
          # See ci.yml's matching Build step for the full rationale. The flag's
          # cap was actively reducing concurrency vs Ninja's default.
          cmake --build --preset ci-windows --config Release --target BALL VIEW BALLView

      - name: Locate BALLView.exe + windeployqt (Windows)
        if: matrix.os == 'windows-x64'
        id: locate-win
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\ci-windows -Filter BALLView.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::BALLView.exe not found in build/ci-windows"
            Get-ChildItem -Path build -Filter "*.exe" -Recurse | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "deploy_dir=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
          # windeployqt ships in vcpkg's installed Qt 6 tools dir
          $wdq = Get-ChildItem -Path build\ci-windows\vcpkg_installed -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wdq) {
            Write-Host "::error::windeployqt.exe not found in vcpkg_installed"
            Get-ChildItem -Path build\ci-windows -Filter "windeployqt*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "windeployqt: $($wdq.FullName)"
          "windeployqt=$($wdq.FullName)" >> $env:GITHUB_OUTPUT

      - name: windeployqt (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          # 2026-05-16 Phase 5.1 carry-forward (release.yml Qt 6 alignment):
          # Qt 6's windeployqt DROPPED the `--no-angle` flag — ANGLE itself
          # was removed from Qt 6 (Qt 6 uses native OpenGL or QRhi, no longer
          # needs the OpenGL-ES → D3D translator). Passing `--no-angle` on
          # Qt 6 produces a hard `Unknown option 'no-angle'.` and exits 1.
          # Drop it. The Phase 5.1 macOS Qt 5 → Qt 6 sweep missed this Windows-
          # side counterpart — surfaced in release.yml run 25957687204 (the
          # second v1.6.1 release attempt).
          #
          # --no-opengl-sw: still valid on Qt 6 — skips opengl32sw.dll
          # (software-Mesa OpenGL fallback). BALL requires hardware OpenGL;
          # the software path isn't useful here and tends to surface
          # similar "DLL does not exist" failures depending on vcpkg port config.
          # See Phase 5.1 backlog D1/D6 for the broader Qt 6 deploy-tooling
          # surface (qttools port required, SW path skipped, etc.).
          & "${{ steps.locate-win.outputs.windeployqt }}" --release `
              --no-translations --no-system-d3d-compiler --no-compiler-runtime `
              --no-opengl-sw `
              "${{ steps.locate-win.outputs.exe }}"

      - name: Bundle data/ next to .exe (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          $dataSrc = Join-Path $env:GITHUB_WORKSPACE "data"
          $dataDst = Join-Path "${{ steps.locate-win.outputs.deploy_dir }}" "data"
          if (Test-Path $dataSrc) {
            Copy-Item -Path $dataSrc -Destination $dataDst -Recurse -Force
            Write-Host "Bundled runtime data alongside BALLView.exe"
          } else {
            Write-Warning "data/ not found at repo root — bundle may be missing runtime resources"
          }

      - name: Zip deploy dir (Windows)
        if: matrix.os == 'windows-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate-win.outputs.deploy_dir }}\*" -DestinationPath "${{ github.workspace }}\${{ steps.resolve.outputs.asset }}" -Force
          Get-Item "${{ github.workspace }}\${{ steps.resolve.outputs.asset }}" | Select-Object Length,Name

      # =====================================================================
      # Upload workflow artifact (consumed by the release job below)
      # =====================================================================
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.resolve.outputs.asset }}
          path: ${{ steps.resolve.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: package
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve ref
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Download all packaging artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" \) -exec ls -lh {} \;

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REF="${{ steps.resolve.outputs.ref }}"
          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.draft || 'true' }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          BODY=$(cat <<'EOF'
          Installers built from this tag.

          - **macOS:** download the `.dmg`, double-click to mount, drag `BALLView.app` to `/Applications`. Signed + notarized (Phase 8a) — no Gatekeeper prompt expected on macOS 14+ / macOS 26+. If the cert is still pending procurement, the `.dmg` ships unsigned: right-click → Open → confirm on first launch, or run `xattr -dr com.apple.quarantine /Applications/BALLView.app` once.
          - **Windows:** download the `.zip`, extract. Windows SmartScreen will warn — choose "More info → Run anyway". Signing is Phase 8b (SignPath).

          Build from source: see `BUILD-macos.md` (macOS), the GitHub Actions CI workflow at the same tag for the Linux + Windows recipes.

          Linux: build from source — Linux installers are Phase 8c.
          EOF
          )

          # If the release doesn't exist yet, create it. Otherwise update assets.
          # Collect both .zip (Windows) and .dmg (macOS, Phase 8a) into a
          # single shell glob — Bash's nullglob handles the empty case if
          # one platform's artifact is missing.
          shopt -s nullglob
          ASSETS=( artifacts/*/*.zip artifacts/*/*.dmg )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No artifacts found to upload (expected .zip and/or .dmg under artifacts/)"
            exit 1
          fi

          if gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $REF exists — uploading assets (clobber)"
            for f in "${ASSETS[@]}"; do
              gh release upload "$REF" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            done
          else
            echo "Creating release $REF $DRAFT_FLAG"
            gh release create "$REF" $DRAFT_FLAG \
              --title "BALLView $REF" \
              --notes "$BODY" \
              --repo "$GITHUB_REPOSITORY" \
              "${ASSETS[@]}"
          fi
